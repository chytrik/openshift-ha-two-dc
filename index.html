<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive guide (CS/SK/PL/RO/EN) to running Red Hat OpenShift with high availability across two data centers. As of 18 October 2026.">
<meta property="og:title" content="OpenShift Two-DC Explorer">
<meta property="og:description" content="etcd quorum simulator, architecture options A–G, configurator, storage/traffic/hub/VM visuals and discovery checklist for OpenShift across two data centers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3271d'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='white'%3E2DC%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>OpenShift Two-DC Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with language + section tabs; one column of sections, each a working panel; max 1080px. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --fg:#182030; --muted:#5a6475; --line:#d3d9e2;
  --accent:#b3271d; --accent-soft:#b3271d1a; --good:#2a7a4b; --good-soft:#2a7a4b1a; --warn:#b06f12; --warn-soft:#b06f121f; --crit:#b3271d; --crit-soft:#b3271d1a; --info:#2b5fa8; --info-soft:#2b5fa81a;
  --display:"Manrope",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121620; --surface:#1a1f2a; --surface2:#222837; --fg:#e7eaf0; --muted:#9aa4b6; --line:#2d3444; --accent:#e4584d; --accent-soft:#e4584d24; --good:#4cae76; --good-soft:#4cae7624; --warn:#d9953a; --warn-soft:#d9953a24; --crit:#e4584d; --crit-soft:#e4584d24; --info:#6c9ae0; --info-soft:#6c9ae024; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#121620; --surface:#1a1f2a; --surface2:#222837; --fg:#e7eaf0; --muted:#9aa4b6; --line:#2d3444; --accent:#e4584d; --accent-soft:#e4584d24; --good:#4cae76; --good-soft:#4cae7624; --warn:#d9953a; --warn-soft:#d9953a24; --crit:#e4584d; --crit-soft:#e4584d24; --info:#6c9ae0; --info-soft:#6c9ae024; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--info)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;font-weight:500;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface2);color:var(--fg)}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:auto}
.lang{border:0;background:transparent;font:inherit;font-family:var(--mono);font-size:.75rem;padding:4px 7px;border-radius:6px;cursor:pointer;color:var(--muted)}
.lang.active{background:var(--fg);color:var(--bg)}
main{padding-block:24px 64px;display:grid;gap:40px}
section{scroll-margin-top:84px;display:grid;gap:18px}
.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:68ch;font-size:1.02rem}
.hero{display:grid;gap:10px;padding-block:8px 4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cell{background:var(--surface2);border-radius:10px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;min-width:0}
.cell ul{margin:0;padding-left:18px;display:grid;gap:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.rec{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.ctl{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
select,input[type=range]{font:inherit}
select{background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.9rem}
.btn{font:inherit;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;border:0;background:var(--surface2);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
/* simulator */
.sim{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.sim{grid-template-columns:3fr 2fr}}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.sites{grid-template-columns:1fr}}
.site{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:pointer;background:var(--surface2);transition:border-color .15s,opacity .15s;min-height:150px;align-content:start;user-select:none}
.site:hover{border-color:var(--muted)}
.site.failed{border-color:var(--crit);background:var(--crit-soft)}
.site.isolated{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}
.site.empty{opacity:.55;cursor:default;border-style:dashed}
.site h4{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nodes{display:flex;flex-wrap:wrap;gap:6px}
.node{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:.68rem;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.node.cp{border-color:var(--info);color:var(--info);background:var(--info-soft)}
.node.arb{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.node.dead{opacity:.35;text-decoration:line-through}
.node.orphan{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.site small{color:var(--muted);font-size:.75rem}
.link{grid-column:1/-1;font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center}
.stats{display:grid;gap:8px}
.stat{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:.9rem}
.stat b{font-family:var(--mono);font-weight:500;font-size:.85rem}
.verdict{border-left:4px solid var(--line);padding:10px 12px;border-radius:0 8px 8px 0;background:var(--surface2);display:grid;gap:4px;font-size:.92rem}
.verdict.good{border-color:var(--good)}.verdict.warn{border-color:var(--warn)}.verdict.crit{border-color:var(--crit)}
.verdict.info{border-color:var(--info)}
/* variants */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;cursor:pointer;background:var(--surface);align-content:start}
.vcard:hover{border-color:var(--muted)}
.vcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vcard .id{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1;color:var(--accent)}
.vcard small{color:var(--muted);font-size:.8rem}
.vcard .pill,.vdetail .pill,td .pill{white-space:normal;text-align:left}
.detail{display:grid;gap:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv div{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:.85rem;display:grid;gap:2px}
.kv span{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:720px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
tr.hl td{background:var(--accent-soft)}
.mapwrap{overflow-x:auto}
svg.map{width:100%;max-width:100%;height:auto;display:block}
svg.map text{font-family:var(--body);fill:var(--fg)}
svg.map .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
svg.map .dot{cursor:pointer}
svg.map .dot circle{fill:var(--surface);stroke:var(--info);stroke-width:2}
svg.map .dot.sel circle{fill:var(--accent);stroke:var(--accent)}
svg.map .dot text{font-size:11px;font-weight:600}
svg.map .grid{stroke:var(--line);stroke-width:1}
/* configurator */
.cfg{display:grid;gap:14px}
@media (min-width:860px){.cfg{grid-template-columns:2fr 3fr}}
.q{display:grid;gap:6px}
.q .lbl{font-size:.85rem;font-weight:600}
.range{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.range output{font-family:var(--mono);font-size:.85rem;min-width:5ch;text-align:right}
.res{display:grid;gap:12px;align-content:start}
.primary{border:2px solid var(--accent);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--accent-soft)}
.primary .id{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--accent);line-height:1}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:.9rem}
.list li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:7px}
.list.warn li::before{background:var(--warn)}
.list.crit li::before{background:var(--crit)}
.list.good li::before{background:var(--good)}
.list.info li::before{background:var(--info)}
/* checklist */
.check{display:grid;gap:6px}
.check label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:.9rem;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
.check label.done{opacity:.55;text-decoration:line-through}
.check .key{border-left:3px solid var(--accent)}
.progress{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.src{display:grid;gap:6px;margin:0;padding-left:18px;font-size:.88rem}
footer{color:var(--muted);font-size:.78rem;padding-block:20px;border-top:1px solid var(--line)}

/* visuals */
.vizwrap{overflow-x:auto;min-width:0}
svg.viz{width:100%;height:auto;display:block;min-width:520px}
svg.viz .vt{font-family:var(--body);font-size:13px;fill:var(--fg)}
svg.viz .vt.h{font-weight:600;font-size:13px}
svg.viz .vt.s{font-size:11px;fill:var(--muted)}
svg.viz .vt.on{fill:var(--bg);font-weight:600}
svg.viz .vt.tot{fill:var(--fg);font-weight:600}
svg.viz .vt.ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
svg.viz .vt.mono{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg.viz .vt.crit{fill:var(--crit);font-weight:600}
svg.viz .vt.chipt{fill:var(--bg);font-weight:600;font-size:10.5px}
svg.viz .vb{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
svg.viz .vb.zone{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
svg.viz .vb.zone.dashed{stroke-dasharray:5 4;fill:none}
svg.viz .vb.zone.down{stroke:var(--crit);fill:var(--crit-soft)}
svg.viz .vb.zone.warn{stroke:var(--warn);fill:var(--warn-soft)}
svg.viz .vb.nd{fill:var(--surface);stroke:var(--line)}
svg.viz .vb.nd.dead{opacity:.4}
svg.viz .vl{fill:none;stroke:var(--muted);stroke-width:1.5}
svg.viz .vl.acc{stroke:var(--info);stroke-width:2}
svg.viz .vl.crit{stroke:var(--crit);stroke-width:2;stroke-dasharray:3 3}
svg.viz .vl.dashed{stroke-dasharray:6 4}
svg.viz .vl.dotted{stroke-dasharray:2 4}
svg.viz .vl.dim{stroke:var(--line);stroke-width:1.25}
svg.viz .mk{fill:var(--muted)} svg.viz .mkA{fill:var(--info)}
svg.viz .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
svg.viz .chip-active{fill:var(--good)} svg.viz .chip-standby{fill:var(--muted)} svg.viz .chip-failover{fill:var(--warn)} svg.viz .chip-down{fill:var(--crit)}
.seg-c1{fill:var(--info)} .seg-c2{fill:var(--warn)} .seg-c3{fill:var(--good)} .seg-c4{fill:var(--crit)} .seg-c5{fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.seg-c1{background:var(--info)} .legend i.seg-c2{background:var(--warn)} .legend i.seg-c3{background:var(--good)} .legend i.seg-c4{background:var(--crit)} .legend i.seg-c5{background:var(--muted)}
.seg.wrap-seg{flex-wrap:wrap}
.seg.wrap-seg button{border-left:0;border-top:1px solid var(--line)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.88rem;align-content:start}
.steps li{color:var(--muted)} .steps li.done{color:var(--fg);opacity:.6} .steps li.cur{color:var(--fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;background:var(--good-soft);color:var(--good)}
.chip.off{background:var(--crit-soft);color:var(--crit);text-decoration:line-through}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.88rem}
.cmp>div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.cmp .cmph{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:transparent;padding-bottom:0}
.cmp .acc{border-left:3px solid var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--crit-soft);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--good)}
.btn:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <div class="brand">OpenShift <b>2×DC</b></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="langs" id="langs"></div>
</div></header>

<main class="wrap" id="main">
  <div class="hero">
    <div class="kicker" data-i18n="hero.kicker"></div>
    <h1 data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.lead"></p>
  </div>

  <section id="principle">
    <div><div class="kicker" data-i18n="nav.principle"></div><h2 data-i18n="principle.title"></h2></div>
    <p class="lead" data-i18n="principle.lead"></p>
    <div class="panel" id="simPanel">
      <div><h3 data-i18n="sim.title"></h3><p class="lead" style="font-size:.92rem" data-i18n="sim.lead"></p></div>
      <div class="controls">
        <label class="ctl"><span data-i18n="sim.topology"></span><select id="topo"></select></label>
        <button class="btn" id="isolate"></button>
        <button class="btn" id="reset"></button>
        <span class="pill" data-i18n="sim.hint"></span>
      </div>
      <div class="sim">
        <div class="sites" id="sites"></div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel" id="hadr"></div>
      <div class="panel" id="drtwo"></div>
    </div>
    <div class="panel" id="disposable"></div>
    <div class="panel" id="blast"></div>
  </section>

  <section id="variants">
    <div><div class="kicker" data-i18n="nav.variants"></div><h2 data-i18n="variants.title"></h2></div>
    <p class="lead" data-i18n="variants.lead"></p>
    <div class="vcards" id="vcards"></div>
    <div class="panel detail" id="vdetail"></div>
    <div class="panel">
      <div><h3 data-i18n="variants.map.title"></h3><p class="lead" style="font-size:.92rem" data-i18n="variants.map.lead"></p></div>
      <div class="mapwrap" id="rpomap"></div>
    </div>
    <div class="panel"><h3 data-i18n="variants.tableTitle"></h3><div class="tablewrap" id="vtable"></div></div>
  </section>

  <section id="config">
    <div><div class="kicker" data-i18n="nav.config"></div><h2 data-i18n="config.title"></h2></div>
    <p class="lead" data-i18n="config.lead"></p>
    <div class="panel cfg">
      <div class="q-list" id="questions" style="display:grid;gap:14px"></div>
      <div class="res" id="result"></div>
    </div>
  </section>

  <section id="data"><div><div class="kicker" data-i18n="nav.data"></div><h2 data-i18n="data.title"></h2></div><p class="lead" data-i18n="data.lead"></p><div class="panel" id="vizStorage"></div><div class="grid3" id="dataItems"></div></section>
  <section id="traffic"><div><div class="kicker" data-i18n="nav.traffic"></div><h2 data-i18n="traffic.title"></h2></div><p class="lead" data-i18n="traffic.lead"></p><div class="panel" id="vizTraffic"></div><div class="grid3" id="trafficItems"></div></section>
  <section id="mgmt"><div><div class="kicker" data-i18n="nav.mgmt"></div><h2 data-i18n="mgmt.title"></h2></div><p class="lead" data-i18n="mgmt.lead"></p><div class="panel" id="vizMgmt"></div><div class="grid3" id="mgmtItems"></div></section>
  <section id="virt"><div><div class="kicker" data-i18n="nav.virt"></div><h2 data-i18n="virt.title"></h2></div><p class="lead" data-i18n="virt.lead"></p><div class="panel" id="vizVirt"></div><div class="grid3" id="virtItems"></div></section>

  <section id="discovery">
    <div><div class="kicker" data-i18n="nav.discovery"></div><h2 data-i18n="discovery.title"></h2></div>
    <p class="lead" data-i18n="discovery.lead"></p>
    <div class="panel"><div class="progress" id="progress"></div><div class="check" id="checklist"></div></div>
  </section>

  <section id="sources">
    <div><div class="kicker" data-i18n="nav.sources"></div><h2 data-i18n="sources.title"></h2></div>
    <p class="lead" data-i18n="sources.lead"></p>
    <div class="grid2" id="srcGroups"></div>
  </section>

  <footer data-i18n="footer"></footer>
</main>
<script>

principle:{
 title:"Why two sites are not enough for one cluster",

 hadr:{title:"HA is not DR",body:"HA covers the failure of a component inside one failure domain and recovers automatically. DR covers the loss of a whole domain (a data center) and is measured in RPO (data lost) and RTO (time down). Three control plane nodes in one DC are HA, not DR."},

data:{title:"Data and storage decide the RPO",lead:"OpenShift does not set the achievable RPO; storage and the application do. First find out where state lives. In banks it is often in databases outside OpenShift, and OpenShift mostly carries the stateless layer.",
 items:[{h:"ODF stretch cluster",b:"One OpenShift cluster, two data zones (< 10 ms RTT) and an arbiter zone. Needs three control plane nodes in three zones and at least four workers split evenly across the data zones."},
  {h:"ODF Metro-DR",b:"Two clusters over an external Red Hat Ceph Storage stretch cluster. RPO 0, all-flash only, one DRPolicy, arbiter at a third location up to ~100 ms away."},
  {h:"ODF Regional-DR",b:"Asynchronous RBD mirroring between two ODF clusters, interval from 1 minute. RPO > 0, no distance limit, failover per application via ACM."},
  {h:"Licensing",b:"All three ODF DR options need ODF Advanced; Metro-DR and Regional-DR also need ACM. OpenShift Platform Plus includes ODF Essentials only."},
  {h:"Storage arrays with CSI replication",b:"Hitachi GAD, NetApp, Pure, Dell, IBM. Volume replication is not standardized in CSI, so failover automation depends on the vendor: no CSI support, CSI VolumeReplication, or replication of namespace metadata too. Most metro solutions need a witness at a third location."},
  {h:"Application-level replication",b:"Database streaming replication, Kafka MirrorMaker 2. The application knows what it replicates and reports its state. Synchronous consensus again needs three sites."},
  {h:"VolSync (part of ACM)",b:"Asynchronous PV copies between clusters without ODF. Fits less critical data."},
  {h:"Backups always sit beside replication",b:"Replication carries logical corruption and deletions too. DORA Article 12 requires restoring into physically and logically separated systems and periodic restore tests."}]},
traffic:{title:"Traffic routing and connectivity",lead:"A global load balancer is mandatory for every two-cluster option; the documentation requires it for a stretched cluster too. With active/active the GSLB health check and DNS TTL define the RTO.",
 items:[{h:"Existing GSLB",b:"F5 BIG-IP DNS, Infoblox and similar are the fastest path: a wide IP per application, health check on a route in each cluster."},
  {h:"Red Hat Connectivity Link (Kuadrant)",b:"DNSPolicy on Gateway API manages global DNS records declaratively. CoreDNS integration for on-prem DNS is GA since 1.3 (Tech Preview in 1.1). Needs zone delegation from corporate DNS to the CoreDNS VIPs."},
  {h:"East-west between clusters",b:"Submariner (part of ACM) at the network layer, Red Hat Service Interconnect (Skupper) at the application layer, or OpenShift Service Mesh 3 in multi-primary federation that prefers the local instance."},
  {h:"Stretched cluster networking",b:"Direct IP connectivity between nodes, uniform MTU, on-prem VIPs (keepalived) for API and ingress that assume one L2 segment. Separate L3 networks per DC need an external load balancer."},
  {h:"Platform dependencies in both DCs",b:"DNS, NTP, IdP (AD/LDAP), image registry (Quay or mirror), Git, Vault and S3 for backups. Otherwise the DR cluster cannot start applications even with the data in place."}]},
mgmt:{title:"The management layer must outlive the outage",lead:"The ACM hub triggers failover through DRPlacementControl and holds placements and policies. If the hub's DC goes down, nobody can start the failover, so the hub must be more resilient than what it protects.",
 items:[{h:"Hub placement",b:"ODF docs: active hub beside the primary cluster and a passive hub beside the secondary, or the active hub at a neutral third site. Hub recovery for Metro-DR is Technology Preview in ODF 4.18."},
  {h:"Active/passive hub via OADP",b:"The active hub backs up to S3; the passive hub keeps restoring passive data (syncRestoreWithNewBackups, default interval 30 min). Activation data are restored only at failover. From ACM 2.7 managed clusters can reconnect automatically."},
  {h:"A label-driven runbook",b:"A git-managed label (active / standby / failover) applied by Policy switches BackupSchedule and BackupStorageLocation between hubs. Usable as a ready-made customer runbook."},
  {h:"GitOps as the source of truth",b:"Application state in Git, DR as an overlay over business as usual. Keep a break-glass path (oc apply -k overlays/dr) for when Git or Argo CD are unreachable."},
  {h:"Triggering failover",b:"Red Hat keeps it manual by default. Event-Driven Ansible can call the ACM API, but the design must guard against false triggers during a partition."}]},
virt:{title:"OpenShift Virtualization",lead:"VMs are the most common reason a customer wants a stretched cluster: they run as one instance, have no application replication and VMware habits expect a vSphere Metro Storage Cluster. The OpenShift equivalent is stretched 1+1+1 with synchronous storage, and like vMSC it needs a third site.",
 items:[{h:"Stretched cluster for VMs",b:"Symmetric storage replication, stretched VLANs, ~5 ms latency and a witness site. The third site is required by etcd and usually hosts one control plane node. Restarted VMs have RPO 0."},
  {h:"No safe VM move without fencing",b:"Node Health Check + Fence Agents Remediation (recommended for Virtualization) with the out-of-service taint. Untuned, rescheduling from an unreachable node takes about 12 minutes; tuned, about 1.5 minutes."},
  {h:"Restart storm",b:"After a DC loss OpenShift reschedules all VMs at once. Control order and pace (node selectors, priorities) and keep ~100% capacity in the surviving DC."},
  {h:"Two clusters for VMs",b:"Unidirectional array replication or ODF Regional/Metro-DR, VM state in GitOps as a DR overlay. Cross-cluster live migration (4.20, Tech Preview) is for planned moves, not DR."},
  {h:"4–5 control plane nodes",b:"Introduced for two-site VM deployments on bare metal (2+2, 3+2). Two etcd copies survive a DC loss, but recovery stays manual."},
  {h:"Subscriptions",b:"A stretched cluster needs both sites fully subscribed; a warm DR site may hold stopped VMs. Confirm DR capacity terms with sales."}]},

variants:{
 title:"Sedm způsobů, jak provozovat OpenShift přes dvě DC",lead:"Klikněte na kartu pro detaily. A a B natahují jeden cluster bez třetí lokality, C s ní, D až G používají dva nezávislé clustery.",tableTitle:"Vedle sebe",
 cols:{dcLoss:"Ztráta celého DC",rpo:"RPO",rto:"RTO",site3:"Třetí lokalita",latency:"Latence mezi DC",verdict:"Hodnocení"},
 map:{title:"Mapa RPO a RTO",lead:"Kde která varianta leží. Vlevo dole je lépe; RPO 0 s automatizovanou obnovou dosáhnou jen C a E a obě potřebují třetí lokalitu.",rpo:"RPO (ztracená data)",rto:"RTO (doba obnovy)",scale:["0","sekundy","minuty","hodiny"]},
 items:[
  {id:"A",name:"Stretched 2+1",short:"Jeden cluster, dva control plane nodes v DC1, jeden v DC2",dcLoss:"Ztráta DC2: v pořádku. Ztráta DC1: API jen pro čtení",rpo:"etcd: ohroženy poslední zápisy; data podle storage",rto:"Ruční, závisí na runbooku",site3:"Ne",latency:"etcd peer RTT < 100 ms (doporučeno < 5 ms); s ODF < 10 ms",verdict:"Nedoporučeno",tone:"crit",
   detail:["Red Hat to podporuje, ale dokumentace to popisuje jako jednu failure doménu, která nesmí nahradit DR plán.","Ztráta většinové lokality přepne API do read-only. Obnova je quorum-restore.sh na posledním nodu v DC2 s rizikem ztráty zápisů, které tam ještě nedorazily.","Vyžaduje přímou IP konektivitu, jednotné MTU a VIP pro API a ingress; oddělené L3 sítě potřebují externí load balancer.","Každé narušení (partition, nesoulad MTU, špička latence, jitter) je nutné otestovat před produkcí."]},
  {id:"B",name:"Stretched 2+2 nebo 3+2",short:"Čtyři nebo pět control plane nodes, jen bare metal, OCP 4.17+",dcLoss:"Jako A, ale přežijí dvě kopie etcd",rpo:"Jako A, nižší riziko",rto:"Ruční",site3:"Ne",latency:"Jako A; jen bare metal",verdict:"Kompromis pro VM bez třetí lokality",tone:"warn",
   detail:["Red Hat zavedl 4 a 5 control plane nodes právě pro dvoulokalitní VM nasazení na bare metal.","Quorum se při ztrátě DC ztratí stejně, ale v přeživší lokalitě zůstanou dvě read-only kopie etcd, takže ruční obnova má zálohu.","Nasazuje se jako 3 nody a škáluje den 2 (Assisted nebo Agent-based installer).","Více control plane nodes mírně snižuje propustnost a zvyšuje latenci."]},
  {id:"C",name:"Stretched 1+1+1",short:"Jeden cluster, jeden control plane node na lokalitu, třetí lokalita hostí rozhodující hlas",dcLoss:"Control plane přežije automaticky",rpo:"0 se synchronním storage",rto:"Minuty: RWX pody ~6–8 min, RWO a VM po fencingu",site3:"Ano, plnohodnotný control plane node",latency:"Datové zóny < 10 ms (ODF); arbiter podle limitů etcd",verdict:"Jen se třetí lokalitou a s DR plánem",tone:"good",
   detail:["Topologie, kterou Red Hat doporučuje pro cluster přes více lokalit: jeden člen control plane na lokalitu, tři lokality.","S ODF stretch clusterem (dvě datové zóny + arbiter zóna) nebo metro polem mají data RPO 0.","Pořád je to jedna failure doména: upgrady, chyby konfigurace a expirace certifikátů zasáhnou obě DC. Držte OADP zálohy mimo cluster nebo druhý cluster.","Třetí lokalita potřebuje skutečný node, ne lehký witness: standardní cluster nemá etcd-only arbiter (Two-Node with Arbiter je edge topologie omezená na dva workery)."]},
  {id:"D",name:"Dva clustery + Regional-DR",short:"Nezávislé clustery, asynchronní replikace volumes (ODF, pole nebo aplikace)",dcLoss:"Failover aplikací přes ACM",rpo:"> 0: interval replikace (od 1 min) a change rate",rto:"Minuty, ručně spuštěno",site3:"Ne (hub ideálně neutrální)",latency:"Bez limitu",verdict:"Výchozí pro stavová data bez třetí lokality",tone:"good",
   detail:["ODF Regional-DR asynchronně zrcadlí RBD volumes mezi dvěma ODF clustery; ACM orchestruje failover a failback po aplikacích.","Vyžaduje ODF Advanced a ACM. OpenShift Platform Plus obsahuje jen ODF Essentials.","Alternativy: asynchronní replikace pole s CSI VolumeReplication, VolSync, nebo replikace v aplikaci (DB streaming, Kafka MirrorMaker 2).","Failover je citlivá operace a zůstává ve výchozím stavu ruční; Event-Driven Ansible ho může automatizovat s ochranou proti falešnému triggeru."]},
  {id:"E",name:"Dva clustery + Metro-DR",short:"Nezávislé clustery nad externím Ceph stretch clusterem s arbiterem",dcLoss:"Failover aplikací přes ACM",rpo:"0",rto:"Minuty",site3:"Ano, Ceph arbiter (~100 ms RTT)",latency:"< 10 ms",verdict:"RPO 0 se dvěma clustery",tone:"good",
   detail:["Externí Red Hat Ceph Storage natažený přes obě DC se synchronní replikací; monitor arbiter sedí ve třetí lokalitě až ~100 ms daleko.","Jen all-flash, erasure coding není podporován, jedna DRPolicy na řešení.","Hub recovery pro Metro-DR je v ODF 4.18 Technology Preview.","Ekvivalent s metro polem: synchronní replikace plus witness, automatizace failoveru podle CSI podpory dodavatele."]},
  {id:"F",name:"Dva clustery active/active",short:"GSLB posílá provoz do obou clusterů najednou",dcLoss:"GSLB přesměruje provoz",rpo:"Stateless 0; stavová data podle aplikace",rto:"Sekundy až minuty (health check + DNS TTL)",site3:"Ne (konsenzuální DB: ano)",latency:"Podle aplikace",verdict:"Výchozí pro stateless",tone:"good",
   detail:["Oba clustery obsluhují provoz; globální load balancer kontroluje route v každém clusteru.","Stavová data replikuje sama aplikace: DB replikace, Kafka MirrorMaker 2, nebo databáze mimo OpenShift.","Konsenzuální databáze (CockroachDB, YugabyteDB) potřebují tři failure domény, stejně jako etcd. Dvě DC jim nestačí.","Oba clustery potřebují stejné platformní závislosti: IdP, registry, Git, Vault, S3, monitoring."]},
  {id:"G",name:"Dva clustery + backup/restore",short:"OADP zálohy do objektového úložiště, obnova na druhém clusteru",dcLoss:"Obnova ze zálohy",rpo:"Frekvence záloh",rto:"Hodiny",site3:"Ne",latency:"Bez limitu",verdict:"Doplněk, ne primární DR",tone:"info",
   detail:["OADP (Velero) zálohuje Kubernetes objekty a persistent volumes (CSI snapshot + data mover) do S3.","Red Hat nedoporučuje zálohy jako jedinou DR strategii: obnovy jsou vzácné, pomalé a málo testované.","Zálohy patří vedle každé další varianty: replikace přenese i logickou korupci a smazání.","DORA článek 12 vyžaduje obnovu do fyzicky i logicky oddělených systémů a pravidelné testy obnovy."]}
 ]

data:{title:"Data a storage rozhodují o RPO",lead:"OpenShift neurčuje dosažitelné RPO; určuje ho storage a aplikace. Nejdřív zjistěte, kde stav leží. U bank často v databázích mimo OpenShift a OpenShift nese hlavně stateless vrstvu.",
 items:[{h:"ODF stretch cluster",b:"Jeden OpenShift cluster, dvě datové zóny (< 10 ms RTT) a arbiter zóna. Vyžaduje tři control plane nodes ve třech zónách a aspoň čtyři workery rovnoměrně v datových zónách."},
  {h:"ODF Metro-DR",b:"Dva clustery nad externím Red Hat Ceph Storage stretch clusterem. RPO 0, jen all-flash, jedna DRPolicy, arbiter ve třetí lokalitě až ~100 ms daleko."},
  {h:"ODF Regional-DR",b:"Asynchronní RBD mirroring mezi dvěma ODF clustery, interval od 1 minuty. RPO > 0, bez limitu vzdálenosti, failover po aplikacích přes ACM."},
  {h:"Licence",b:"Všechny tři ODF DR varianty vyžadují ODF Advanced; Metro-DR a Regional-DR navíc ACM. OpenShift Platform Plus obsahuje jen ODF Essentials."},
  {h:"Storage pole s CSI replikací",b:"Hitachi GAD, NetApp, Pure, Dell, IBM. Replikace volume není v CSI standardizovaná, takže automatizace failoveru závisí na dodavateli: bez CSI podpory, CSI VolumeReplication, nebo i replikace metadat namespace. Většina metro řešení potřebuje witness ve třetí lokalitě."},
  {h:"Replikace v aplikaci",b:"DB streaming replikace, Kafka MirrorMaker 2. Aplikace ví, co replikuje, a hlásí stav. Synchronní konsenzus znovu vyžaduje tři lokality."},
  {h:"VolSync (součást ACM)",b:"Asynchronní kopie PV mezi clustery bez ODF. Vhodné pro méně kritická data."},
  {h:"Zálohy vždy vedle replikace",b:"Replikace přenese i logickou korupci a smazání. DORA článek 12 vyžaduje obnovu do fyzicky i logicky oddělených systémů a pravidelné testy obnovy."}]},
traffic:{title:"Řízení provozu a konektivita",lead:"Globální load balancer je povinná součást každé varianty se dvěma clustery; dokumentace ho vyžaduje i pro stretched cluster. U active/active určuje RTO health check GSLB a DNS TTL.",
 items:[{h:"Existující GSLB",b:"F5 BIG-IP DNS, Infoblox a podobné jsou nejrychlejší cesta: wide IP na aplikaci, health check na route v každém clusteru."},
  {h:"Red Hat Connectivity Link (Kuadrant)",b:"DNSPolicy na Gateway API spravuje globální DNS záznamy deklarativně. Integrace s CoreDNS pro on-prem DNS je od 1.3 GA (v 1.1 Tech Preview). Vyžaduje delegaci zóny z firemního DNS na CoreDNS VIP."},
  {h:"East-west mezi clustery",b:"Submariner (součást ACM) na síťové vrstvě, Red Hat Service Interconnect (Skupper) na aplikační vrstvě, nebo OpenShift Service Mesh 3 v multi-primary federaci s preferencí lokální instance."},
  {h:"Síť stretched clusteru",b:"Přímá IP konektivita mezi nody, jednotné MTU, on-prem VIP (keepalived) pro API a ingress, které předpokládají jeden L2 segment. Oddělené L3 sítě DC potřebují externí load balancer."},
  {h:"Platformní závislosti v obou DC",b:"DNS, NTP, IdP (AD/LDAP), image registry (Quay nebo mirror), Git, Vault a S3 pro zálohy. Jinak DR cluster aplikace nespustí, i když data má."}]},
mgmt:{title:"Management vrstva musí výpadek přežít",lead:"ACM hub spouští failover přes DRPlacementControl a drží placementy a policies. Když padne DC s hubem, failover nemá kdo spustit, proto musí být hub odolnější než to, co chrání.",
 items:[{h:"Umístění hubu",b:"Dokumentace ODF: aktivní hub u primárního clusteru a pasivní u sekundárního, nebo aktivní hub v neutrální třetí lokalitě. Hub recovery pro Metro-DR je v ODF 4.18 Technology Preview."},
  {h:"Active/passive hub přes OADP",b:"Aktivní hub zálohuje do S3; pasivní průběžně obnovuje pasivní data (syncRestoreWithNewBackups, výchozí interval 30 min). Aktivační data se obnoví až při failoveru. Od ACM 2.7 se managed clustery umí znovu připojit automaticky."},
  {h:"Runbook řízený labelem",b:"Label spravovaný v Gitu (active / standby / failover) aplikovaný přes Policy přepíná BackupSchedule a BackupStorageLocation mezi huby. Použitelné jako hotový runbook pro zákazníka."},
  {h:"GitOps jako zdroj pravdy",b:"Stav aplikací v Gitu, DR jako overlay nad běžným stavem. Držte break-glass cestu (oc apply -k overlays/dr) pro případ, že Git nebo Argo CD nejsou dostupné."},
  {h:"Spouštění failoveru",b:"Red Hat ho standardně nechává ruční. Event-Driven Ansible může volat ACM API, ale návrh musí řešit ochranu proti falešnému triggeru při partition."}]},
virt:{title:"OpenShift Virtualization",lead:"VM jsou nejčastější důvod, proč zákazník chce stretched cluster: běží v jedné instanci, nemají aplikační replikaci a z VMware jsou zvyklé na vSphere Metro Storage Cluster. Ekvivalent v OpenShiftu je stretched 1+1+1 se synchronním storage, a stejně jako vMSC potřebuje třetí lokalitu.",
 items:[{h:"Stretched cluster pro VM",b:"Symetrická replikace storage, stretched VLAN, latence ~5 ms a witness site. Třetí lokalitu vyžaduje etcd a obvykle hostí jeden control plane node. Restartované VM mají RPO 0."},
  {h:"Bez fencingu se VM nepřesunou bezpečně",b:"Node Health Check + Fence Agents Remediation (doporučeno pro Virtualization) s out-of-service taintem. Bez ladění trvá přeplánování z nedostupného nodu zhruba 12 minut, s laděním kolem 1,5 minuty."},
  {h:"Restart storm",b:"Po ztrátě DC OpenShift přeplánuje všechny VM najednou. Řiďte pořadí a tempo (node selectory, priority) a držte ~100 % kapacity v přeživším DC."},
  {h:"Dva clustery pro VM",b:"Jednosměrná replikace pole nebo ODF Regional/Metro-DR, stav VM v GitOps jako DR overlay. Cross-cluster live migration (4.20, Tech Preview) slouží pro plánované přesuny, ne pro DR."},
  {h:"4–5 control plane nodes",b:"Zavedeno pro dvoulokalitní VM nasazení na bare metal (2+2, 3+2). Při ztrátě DC přežijí dvě kopie etcd, obnova ale zůstává ruční."},
  {h:"Subskripce",b:"Stretched cluster vyžaduje obě lokality plně subskribované; warm DR lokalita může držet vypnuté VM. Podmínky pro DR kapacitu ověřte se sales."}]},
discovery:{title:"Otázky pro zákazníka",lead:"Tyto odpovědi rozhodnou mezi variantami víc než cokoli jiného. První tři jsou klíčové.",
 items:[{k:1,t:"Co pro vás znamená „HA“: jaké RPO a RTO potřebují jednotlivé aplikační tiery, a spouští failover automatika, nebo člověk?"},
  {k:1,t:"Existuje třetí lokalita? Provozujete už witness, mediator nebo tiebreaker pro storage nebo vSAN? Může tam stát server nebo VM pro control plane node či Ceph arbiter?"},
  {k:1,t:"Kde leží stavová data: databáze mimo OpenShift, PV v OpenShiftu, nebo VM?"},
  {k:0,t:"Platforma: bare metal, vSphere, nebo jiná? (4–5 control plane nodes jen na bare metal; na vSphere hraje roli vSphere HA a vMSC.)"},
  {k:0,t:"Síť mezi DC: vzdálenost, RTT a jitter, šířka pásma, stretched L2 ano/ne, redundance tras."},
  {k:0,t:"Storage: ODF, nebo pole s CSI driverem? Který dodavatel a podporuje CSI VolumeReplication?"},
  {k:0,t:"Existující GSLB a DNS (F5, Infoblox) a kdo je spravuje?"},
  {k:0,t:"Platformní závislosti v obou DC: IdP, registry, Git, Vault, S3, monitoring."},
  {k:0,t:"Regulace: DORA, požadavky regulátora nebo interní politika na oddělené zálohy a frekvenci DR testů."},
  {k:0,t:"Licence: OpenShift Platform Plus, nebo OCP + ACM + ODF zvlášť? DR funkce ODF vyžadují ODF Advanced."}],

hero:{kicker:"Interaktívny sprievodca",title:"Vysoká dostupnosť OpenShift naprieč dvoma dátovými centrami",lead:"Čo cluster natiahnutý cez dve lokality dokáže a nedokáže, prečo záleží na tretej lokalite a ktorá architektúra zodpovedá vášmu RPO, dátam a workloadom. Vyskúšajte simulátor a nechajte konfigurátor vybrať variant."},
footer:"Stav k 18. 10. 2026. Informatívny materiál, nie oficiálne stanovisko podpory Red Hat; možnosti produktov sa medzi verziami menia, overte ich v aktuálnej dokumentácii. Vychádza z dokumentácie Red Hat (OCP 4.21 etcd guidance, ODF 4.18 DR, ACM) a blogov Red Hat. Hodnoty RPO/RTO sú typické rozsahy; zmerajte ich vlastným testom.",
principle:{
 title:"Prečo dve lokality jednému clusteru nestačia",
 lead:"OpenShift drží svoj stav v etcd, ktoré potrebuje zhodu väčšiny členov. Pri rozdelení do dvoch lokalít má väčšinu vždy jedna z nich. Keď táto lokalita vypadne, control plane prestane zapisovať.",
 hadr:{title:"HA nie je DR",body:"HA kryje výpadok komponentu vnútri jednej failure domény a zotaví sa automaticky. DR kryje stratu celej domény (dátového centra) a meria sa v RPO (stratené dáta) a RTO (čas výpadku). Tri control plane nodes v jednom DC sú HA, nie DR."},
 drtwo:{title:"DR sú dva problémy",body:"Red Hat nechráni samotný cluster. Chráni kontinuitu aplikácií ich failoverom na iný cluster. To znamená vyriešiť smerovanie prevádzky a replikáciu dát. Stateless aplikácie potrebujú len prvé, stavové obidve."},
 disposable:{title:"Cluster je disposable, dáta nie",lead:"Kubernetes predpokladá, že cluster sa dá postaviť znova. S GitOps je každý cluster, operátor aj aplikácia reprodukovateľný z Gitu. Čo z Gitu postaviť nejde, je stav aplikácií. DR navrhujte okolo neho.",
  cols:[{h:"Postaviteľné z Gitu",items:["Inštalačná konfigurácia clustera a day-2 operátory","Namespaces, Deployments, Routes, Policies","Secrets a konfigurácia cez Vault / sealed secrets","ACM placementy, DR overlaye"]},
        {h:"Nutné chrániť",items:["Databázy (v OpenShifte aj mimo neho)","Persistent volumes a disky VM","Logy správ (Kafka), objektové úložisko","Certifikáty, kľúče, stav IdP"]},
        {h:"Dôsledok",items:["Rozpočet na HA dajte do replikácie dát, nie do naťahovania control plane","Druhému clusteru postavenému z Gitu sa dá veriť lacnejšie než stretched clusteru","Zálohy musia existovať popri replikácii: replikácia prenesie aj korupciu"]}]},
 blast:{title:"Blast radius",body:"Stretched cluster spája obe DC do jednej failure domény. Chybný upgrade, zlá MachineConfig, expirované certifikáty alebo poškodené etcd zasiahnu obe lokality naraz. Dva clustery tieto chyby izolujú a dovolia upgradovať jeden ako canary. Partition siete je horšia než čistý výpadok: pody v izolovanej lokalite bežia ďalej bez riadenia, takže stavové pody a VM potrebujú fencing, kým ich možno spustiť inde."}

 items:[
  {id:"A",name:"Stretched 2+1",short:"Jeden cluster, dva control plane nodes v DC1, jeden v DC2",dcLoss:"Strata DC2: v poriadku. Strata DC1: API len na čítanie",rpo:"etcd: ohrozené posledné zápisy; dáta podľa storage",rto:"Ručné, závisí od runbooku",site3:"Nie",latency:"etcd peer RTT < 100 ms (odporúčané < 5 ms); s ODF < 10 ms",verdict:"Neodporúčané",tone:"crit",
   detail:["Red Hat to podporuje, ale dokumentácia to opisuje ako jednu failure doménu, ktorá nesmie nahradiť DR plán.","Strata väčšinovej lokality prepne API do read-only. Obnova je quorum-restore.sh na poslednom node v DC2 s rizikom straty zápisov, ktoré tam ešte nedorazili.","Vyžaduje priamu IP konektivitu, jednotné MTU a VIP pre API a ingress; oddelené L3 siete potrebujú externý load balancer.","Každé narušenie (partition, nesúlad MTU, špička latencie, jitter) treba otestovať pred produkciou."]},
  {id:"B",name:"Stretched 2+2 alebo 3+2",short:"Štyri alebo päť control plane nodes, len bare metal, OCP 4.17+",dcLoss:"Ako A, ale prežijú dve kópie etcd",rpo:"Ako A, nižšie riziko",rto:"Ručné",site3:"Nie",latency:"Ako A; len bare metal",verdict:"Kompromis pre VM bez tretej lokality",tone:"warn",
   detail:["Red Hat zaviedol 4 a 5 control plane nodes práve pre dvojlokalitné VM nasadenia na bare metal.","Quorum sa pri strate DC stratí rovnako, ale v preživšej lokalite zostanú dve read-only kópie etcd, takže ručná obnova má zálohu.","Nasadzuje sa ako 3 nody a škáluje deň 2 (Assisted alebo Agent-based installer).","Viac control plane nodes mierne znižuje priepustnosť a zvyšuje latenciu."]},
  {id:"C",name:"Stretched 1+1+1",short:"Jeden cluster, jeden control plane node na lokalitu, tretia lokalita hostí rozhodujúci hlas",dcLoss:"Control plane prežije automaticky",rpo:"0 so synchrónnym storage",rto:"Minúty: RWX pody ~6–8 min, RWO a VM po fencingu",site3:"Áno, plnohodnotný control plane node",latency:"Dátové zóny < 10 ms (ODF); arbiter podľa limitov etcd",verdict:"Len s treťou lokalitou a s DR plánom",tone:"good",
   detail:["Topológia, ktorú Red Hat odporúča pre cluster cez viac lokalít: jeden člen control plane na lokalitu, tri lokality.","S ODF stretch clusterom (dve dátové zóny + arbiter zóna) alebo metro poľom majú dáta RPO 0.","Stále je to jedna failure doména: upgrady, chyby konfigurácie a expirácia certifikátov zasiahnu obe DC. Držte OADP zálohy mimo clustera alebo druhý cluster.","Tretia lokalita potrebuje skutočný node, nie ľahký witness: štandardný cluster nemá etcd-only arbiter (Two-Node with Arbiter je edge topológia obmedzená na dva workery)."]},
  {id:"D",name:"Dva clustery + Regional-DR",short:"Nezávislé clustery, asynchrónna replikácia volumes (ODF, pole alebo aplikácia)",dcLoss:"Failover aplikácií cez ACM",rpo:"> 0: interval replikácie (od 1 min) a change rate",rto:"Minúty, ručne spustené",site3:"Nie (hub ideálne neutrálny)",latency:"Bez limitu",verdict:"Predvolené pre stavové dáta bez tretej lokality",tone:"good",
   detail:["ODF Regional-DR asynchrónne zrkadlí RBD volumes medzi dvoma ODF clustermi; ACM orchestruje failover a failback po aplikáciách.","Vyžaduje ODF Advanced a ACM. OpenShift Platform Plus obsahuje len ODF Essentials.","Alternatívy: asynchrónna replikácia poľa s CSI VolumeReplication, VolSync, alebo replikácia v aplikácii (DB streaming, Kafka MirrorMaker 2).","Failover je citlivá operácia a zostáva predvolene ručný; Event-Driven Ansible ho môže automatizovať s ochranou proti falošnému triggeru."]},
  {id:"E",name:"Dva clustery + Metro-DR",short:"Nezávislé clustery nad externým Ceph stretch clusterom s arbitrom",dcLoss:"Failover aplikácií cez ACM",rpo:"0",rto:"Minúty",site3:"Áno, Ceph arbiter (~100 ms RTT)",latency:"< 10 ms",verdict:"RPO 0 s dvoma clustermi",tone:"good",
   detail:["Externý Red Hat Ceph Storage natiahnutý cez obe DC so synchrónnou replikáciou; monitor arbiter sedí v tretej lokalite až ~100 ms ďaleko.","Len all-flash, erasure coding nie je podporovaný, jedna DRPolicy na riešenie.","Hub recovery pre Metro-DR je v ODF 4.18 Technology Preview.","Ekvivalent s metro poľom: synchrónna replikácia plus witness, automatizácia failoveru podľa CSI podpory dodávateľa."]},
  {id:"F",name:"Dva clustery active/active",short:"GSLB posiela prevádzku do oboch clusterov naraz",dcLoss:"GSLB presmeruje prevádzku",rpo:"Stateless 0; stavové dáta podľa aplikácie",rto:"Sekundy až minúty (health check + DNS TTL)",site3:"Nie (konsenzuálne DB: áno)",latency:"Podľa aplikácie",verdict:"Predvolené pre stateless",tone:"good",
   detail:["Oba clustery obsluhujú prevádzku; globálny load balancer kontroluje route v každom clusteri.","Stavové dáta replikuje sama aplikácia: DB replikácia, Kafka MirrorMaker 2, alebo databáza mimo OpenShift.","Konsenzuálne databázy (CockroachDB, YugabyteDB) potrebujú tri failure domény, rovnako ako etcd. Dve DC im nestačia.","Oba clustery potrebujú rovnaké platformové závislosti: IdP, registry, Git, Vault, S3, monitoring."]},
  {id:"G",name:"Dva clustery + backup/restore",short:"OADP zálohy do objektového úložiska, obnova na druhom clusteri",dcLoss:"Obnova zo zálohy",rpo:"Frekvencia záloh",rto:"Hodiny",site3:"Nie",latency:"Bez limitu",verdict:"Doplnok, nie primárne DR",tone:"info",

data:{title:"Dáta a storage rozhodujú o RPO",lead:"OpenShift neurčuje dosiahnuteľné RPO; určuje ho storage a aplikácia. Najprv zistite, kde stav leží. V bankách často v databázach mimo OpenShift a OpenShift nesie hlavne stateless vrstvu.",
 items:[{h:"ODF stretch cluster",b:"Jeden OpenShift cluster, dve dátové zóny (< 10 ms RTT) a arbiter zóna. Vyžaduje tri control plane nodes v troch zónach a aspoň štyri workery rovnomerne v dátových zónach."},
  {h:"ODF Metro-DR",b:"Dva clustery nad externým Red Hat Ceph Storage stretch clusterom. RPO 0, len all-flash, jedna DRPolicy, arbiter v tretej lokalite až ~100 ms ďaleko."},
  {h:"ODF Regional-DR",b:"Asynchrónny RBD mirroring medzi dvoma ODF clustermi, interval od 1 minúty. RPO > 0, bez limitu vzdialenosti, failover po aplikáciách cez ACM."},
  {h:"Licencie",b:"Všetky tri ODF DR varianty vyžadujú ODF Advanced; Metro-DR a Regional-DR navyše ACM. OpenShift Platform Plus obsahuje len ODF Essentials."},
  {h:"Storage polia s CSI replikáciou",b:"Hitachi GAD, NetApp, Pure, Dell, IBM. Replikácia volume nie je v CSI štandardizovaná, takže automatizácia failoveru závisí od dodávateľa: bez CSI podpory, CSI VolumeReplication, alebo aj replikácia metadát namespace. Väčšina metro riešení potrebuje witness v tretej lokalite."},
  {h:"Replikácia v aplikácii",b:"DB streaming replikácia, Kafka MirrorMaker 2. Aplikácia vie, čo replikuje, a hlási stav. Synchrónny konsenzus znova vyžaduje tri lokality."},
  {h:"VolSync (súčasť ACM)",b:"Asynchrónne kópie PV medzi clustermi bez ODF. Vhodné pre menej kritické dáta."},
  {h:"Zálohy vždy popri replikácii",b:"Replikácia prenesie aj logickú korupciu a zmazanie. DORA článok 12 vyžaduje obnovu do fyzicky aj logicky oddelených systémov a pravidelné testy obnovy."}]},
traffic:{title:"Riadenie prevádzky a konektivita",lead:"Globálny load balancer je povinná súčasť každého variantu s dvoma clustermi; dokumentácia ho vyžaduje aj pre stretched cluster. Pri active/active určuje RTO health check GSLB a DNS TTL.",
 items:[{h:"Existujúce GSLB",b:"F5 BIG-IP DNS, Infoblox a podobné sú najrýchlejšia cesta: wide IP na aplikáciu, health check na route v každom clusteri."},
  {h:"Red Hat Connectivity Link (Kuadrant)",b:"DNSPolicy na Gateway API spravuje globálne DNS záznamy deklaratívne. Integrácia s CoreDNS pre on-prem DNS je od 1.3 GA (v 1.1 Tech Preview). Vyžaduje delegáciu zóny z firemného DNS na CoreDNS VIP."},
  {h:"East-west medzi clustermi",b:"Submariner (súčasť ACM) na sieťovej vrstve, Red Hat Service Interconnect (Skupper) na aplikačnej vrstve, alebo OpenShift Service Mesh 3 v multi-primary federácii s preferenciou lokálnej inštancie."},
  {h:"Sieť stretched clustera",b:"Priama IP konektivita medzi nodmi, jednotné MTU, on-prem VIP (keepalived) pre API a ingress, ktoré predpokladajú jeden L2 segment. Oddelené L3 siete DC potrebujú externý load balancer."},
  {h:"Platformové závislosti v oboch DC",b:"DNS, NTP, IdP (AD/LDAP), image registry (Quay alebo mirror), Git, Vault a S3 pre zálohy. Inak DR cluster aplikácie nespustí, aj keď dáta má."}]},
mgmt:{title:"Manažment vrstva musí výpadok prežiť",lead:"ACM hub spúšťa failover cez DRPlacementControl a drží placementy a policies. Keď padne DC s hubom, failover nemá kto spustiť, preto musí byť hub odolnejší než to, čo chráni.",
 items:[{h:"Umiestnenie hubu",b:"Dokumentácia ODF: aktívny hub pri primárnom clusteri a pasívny pri sekundárnom, alebo aktívny hub v neutrálnej tretej lokalite. Hub recovery pre Metro-DR je v ODF 4.18 Technology Preview."},
  {h:"Active/passive hub cez OADP",b:"Aktívny hub zálohuje do S3; pasívny priebežne obnovuje pasívne dáta (syncRestoreWithNewBackups, predvolený interval 30 min). Aktivačné dáta sa obnovia až pri failoveri. Od ACM 2.7 sa managed clustery vedia znova pripojiť automaticky."},
  {h:"Runbook riadený labelom",b:"Label spravovaný v Gite (active / standby / failover) aplikovaný cez Policy prepína BackupSchedule a BackupStorageLocation medzi hubmi. Použiteľné ako hotový runbook pre zákazníka."},
  {h:"GitOps ako zdroj pravdy",b:"Stav aplikácií v Gite, DR ako overlay nad bežným stavom. Držte break-glass cestu (oc apply -k overlays/dr) pre prípad, že Git alebo Argo CD nie sú dostupné."},
  {h:"Spúšťanie failoveru",b:"Red Hat ho štandardne necháva ručný. Event-Driven Ansible môže volať ACM API, ale návrh musí riešiť ochranu proti falošnému triggeru pri partition."}]},
virt:{title:"OpenShift Virtualization",lead:"VM sú najčastejší dôvod, prečo zákazník chce stretched cluster: bežia v jednej inštancii, nemajú aplikačnú replikáciu a z VMware sú zvyknuté na vSphere Metro Storage Cluster. Ekvivalent v OpenShifte je stretched 1+1+1 so synchrónnym storage, a rovnako ako vMSC potrebuje tretiu lokalitu.",
 items:[{h:"Stretched cluster pre VM",b:"Symetrická replikácia storage, stretched VLAN, latencia ~5 ms a witness site. Tretiu lokalitu vyžaduje etcd a zvyčajne hostí jeden control plane node. Reštartované VM majú RPO 0."},
  {h:"Bez fencingu sa VM nepresunú bezpečne",b:"Node Health Check + Fence Agents Remediation (odporúčané pre Virtualization) s out-of-service taintom. Bez ladenia trvá preplánovanie z nedostupného nodu zhruba 12 minút, s ladením okolo 1,5 minúty."},
  {h:"Restart storm",b:"Po strate DC OpenShift preplánuje všetky VM naraz. Riaďte poradie a tempo (node selectory, priority) a držte ~100 % kapacity v preživšom DC."},
  {h:"Dva clustery pre VM",b:"Jednosmerná replikácia poľa alebo ODF Regional/Metro-DR, stav VM v GitOps ako DR overlay. Cross-cluster live migration (4.20, Tech Preview) slúži na plánované presuny, nie na DR."},
  {h:"4–5 control plane nodes",b:"Zavedené pre dvojlokalitné VM nasadenia na bare metal (2+2, 3+2). Pri strate DC prežijú dve kópie etcd, obnova však zostáva ručná."},
  {h:"Subskripcie",b:"Stretched cluster vyžaduje obe lokality plne subskribované; warm DR lokalita môže držať vypnuté VM. Podmienky pre DR kapacitu overte so sales."}]},
discovery:{title:"Otázky pre zákazníka",lead:"Tieto odpovede rozhodnú medzi variantmi viac než čokoľvek iné. Prvé tri sú kľúčové.",
 items:[{k:1,t:"Čo pre vás znamená „HA“: aké RPO a RTO potrebujú jednotlivé aplikačné tiery, a spúšťa failover automatika, alebo človek?"},
  {k:1,t:"Existuje tretia lokalita? Prevádzkujete už witness, mediator alebo tiebreaker pre storage alebo vSAN? Môže tam stáť server alebo VM pre control plane node či Ceph arbiter?"},
  {k:1,t:"Kde ležia stavové dáta: databázy mimo OpenShift, PV v OpenShifte, alebo VM?"},
  {k:0,t:"Platforma: bare metal, vSphere, alebo iná? (4–5 control plane nodes len na bare metal; na vSphere hrá rolu vSphere HA a vMSC.)"},
  {k:0,t:"Sieť medzi DC: vzdialenosť, RTT a jitter, šírka pásma, stretched L2 áno/nie, redundancia trás."},
  {k:0,t:"Storage: ODF, alebo pole s CSI driverom? Ktorý dodávateľ a podporuje CSI VolumeReplication?"},
  {k:0,t:"Existujúce GSLB a DNS (F5, Infoblox) a kto ich spravuje?"},
  {k:0,t:"Platformové závislosti v oboch DC: IdP, registry, Git, Vault, S3, monitoring."},
  {k:0,t:"Regulácia: DORA, požiadavky regulátora alebo interná politika na oddelené zálohy a frekvenciu DR testov."},
  {k:0,t:"Licencie: OpenShift Platform Plus, alebo OCP + ACM + ODF zvlášť? DR funkcie ODF vyžadujú ODF Advanced."}],

hero:{kicker:"Interaktywny przewodnik",title:"Wysoka dostępność OpenShift w dwóch centrach danych",lead:"Co klaster rozciągnięty między dwiema lokalizacjami potrafi, a czego nie, dlaczego liczy się trzecia lokalizacja i która architektura odpowiada Twojemu RPO, danym i workloadom. Wypróbuj symulator i pozwól konfiguratorowi wybrać wariant."},
footer:"Stan na 18.10.2026. Materiał informacyjny, nie oficjalne stanowisko wsparcia Red Hat; możliwości produktów zmieniają się między wersjami, sprawdź je w aktualnej dokumentacji. Na podstawie dokumentacji Red Hat (OCP 4.21 etcd guidance, ODF 4.18 DR, ACM) i blogów Red Hat. Wartości RPO/RTO to typowe zakresy; zmierz je własnym testem.",
principle:{
 title:"Dlaczego dwie lokalizacje to za mało dla jednego klastra",
 lead:"OpenShift przechowuje stan w etcd, które wymaga zgody większości członków. Przy podziale na dwie lokalizacje większość zawsze ma jedna z nich. Gdy ta lokalizacja padnie, control plane przestaje zapisywać.",
 hadr:{title:"HA to nie DR",body:"HA pokrywa awarię komponentu wewnątrz jednej failure domain i odtwarza się automatycznie. DR pokrywa utratę całej domeny (centrum danych) i mierzy się je w RPO (utracone dane) i RTO (czas przestoju). Trzy węzły control plane w jednym DC to HA, nie DR."},
 drtwo:{title:"DR to dwa problemy",body:"Red Hat nie chroni samego klastra. Chroni ciągłość aplikacji przez ich failover na inny klaster. Oznacza to rozwiązanie routingu ruchu i replikacji danych. Aplikacje stateless potrzebują tylko pierwszego, stanowe obu."},
 disposable:{title:"Klaster jest disposable, dane nie",lead:"Kubernetes zakłada, że klaster można odbudować. Z GitOps każdy klaster, operator i aplikacja są odtwarzalne z Gita. Czego z Gita nie da się odbudować, to stan aplikacji. DR projektuj wokół niego.",
  cols:[{h:"Odtwarzalne z Gita",items:["Konfiguracja instalacji klastra i operatory day-2","Namespaces, Deployments, Routes, Policies","Secrets i konfiguracja przez Vault / sealed secrets","Placementy ACM, overlaye DR"]},
        {h:"Trzeba chronić",items:["Bazy danych (w OpenShift i poza nim)","Persistent volumes i dyski VM","Logi komunikatów (Kafka), object storage","Certyfikaty, klucze, stan IdP"]},
        {h:"Konsekwencja",items:["Budżet na HA przeznacz na replikację danych, nie na rozciąganie control plane","Drugiemu klastrowi zbudowanemu z Gita można zaufać taniej niż rozciągniętemu","Kopie zapasowe muszą istnieć obok replikacji: replikacja przenosi też uszkodzenia"]}]},
 blast:{title:"Blast radius",body:"Klaster rozciągnięty łączy oba DC w jedną failure domain. Błędny upgrade, zła MachineConfig, wygasłe certyfikaty lub uszkodzone etcd uderzają w obie lokalizacje naraz. Dwa klastry izolują te błędy i pozwalają upgrade'ować jeden jako canary. Partycja sieci jest gorsza niż czysta awaria: pody w odizolowanej lokalizacji działają dalej bez kontroli, więc pody stanowe i VM wymagają fencingu, zanim uruchomi się je gdzie indziej."}
},

variants:{
 title:"Siedem sposobów na OpenShift w dwóch DC",lead:"Kliknij kartę, aby zobaczyć szczegóły. A i B rozciągają jeden klaster bez trzeciej lokalizacji, C z nią, D do G używają dwóch niezależnych klastrów.",tableTitle:"Obok siebie",
 cols:{dcLoss:"Utrata całego DC",rpo:"RPO",rto:"RTO",site3:"Trzecia lokalizacja",latency:"Latencja między DC",verdict:"Ocena"},
 map:{title:"Mapa RPO i RTO",lead:"Gdzie leży każdy wariant. Lewy dolny róg jest lepszy; RPO 0 z automatycznym odtworzeniem osiągają tylko C i E, oba wymagają trzeciej lokalizacji.",rpo:"RPO (utracone dane)",rto:"RTO (czas odtworzenia)",scale:["0","sekundy","minuty","godziny"]},
 items:[
  {id:"A",name:"Stretched 2+1",short:"Jeden klaster, dwa węzły control plane w DC1, jeden w DC2",dcLoss:"Utrata DC2: w porządku. Utrata DC1: API tylko do odczytu",rpo:"etcd: ostatnie zapisy zagrożone; dane wg storage",rto:"Ręczne, zależne od runbooka",site3:"Nie",latency:"etcd peer RTT < 100 ms (zalecane < 5 ms); z ODF < 10 ms",verdict:"Niezalecane",tone:"crit",
   detail:["Wspierane przez Red Hat, ale dokumentacja opisuje to jako jedną failure domain, która nie może zastąpić planu DR.","Utrata lokalizacji większościowej przełącza API w read-only. Odtworzenie to quorum-restore.sh na ostatnim węźle w DC2 z ryzykiem utraty zapisów, które tam nie dotarły.","Wymaga bezpośredniej łączności IP, jednolitego MTU i VIP dla API i ingress; oddzielne sieci L3 wymagają zewnętrznego load balancera.","Każde zakłócenie (partycja, niezgodność MTU, skok latencji, jitter) trzeba przetestować przed produkcją."]},
  {id:"B",name:"Stretched 2+2 lub 3+2",short:"Cztery lub pięć węzłów control plane, tylko bare metal, OCP 4.17+",dcLoss:"Jak A, ale przeżywają dwie kopie etcd",rpo:"Jak A, mniejsze ryzyko",rto:"Ręczne",site3:"Nie",latency:"Jak A; tylko bare metal",verdict:"Kompromis dla VM bez trzeciej lokalizacji",tone:"warn",
   detail:["Red Hat wprowadził 4 i 5 węzłów control plane właśnie dla dwulokalizacyjnych wdrożeń VM na bare metal.","Quorum przy utracie DC ginie tak samo, ale w ocalałej lokalizacji zostają dwie kopie etcd read-only, więc ręczne odtworzenie ma zapas.","Wdrażane jako 3 węzły i skalowane w dniu 2 (Assisted lub Agent-based installer).","Więcej węzłów control plane nieznacznie obniża przepustowość i zwiększa latencję."]},
  {id:"C",name:"Stretched 1+1+1",short:"Jeden klaster, jeden węzeł control plane na lokalizację, trzecia lokalizacja z głosem rozstrzygającym",dcLoss:"Control plane przeżywa automatycznie",rpo:"0 z synchronicznym storage",rto:"Minuty: pody RWX ~6–8 min, RWO i VM po fencingu",site3:"Tak, pełny węzeł control plane",latency:"Strefy danych < 10 ms (ODF); arbiter wg limitów etcd",verdict:"Tylko z trzecią lokalizacją i planem DR",tone:"good",
   detail:["Topologia zalecana przez Red Hat dla klastra w wielu lokalizacjach: jeden członek control plane na lokalizację, trzy lokalizacje.","Z ODF stretch cluster (dwie strefy danych + strefa arbitra) lub macierzą metro dane mają RPO 0.","To wciąż jedna failure domain: upgrade'y, błędy konfiguracji i wygaśnięcie certyfikatów uderzają w oba DC. Trzymaj kopie OADP poza klastrem lub drugi klaster.","Trzecia lokalizacja potrzebuje prawdziwego węzła, nie lekkiego witnessa: standardowy klaster nie ma arbitra etcd-only (Two-Node with Arbiter to topologia edge ograniczona do dwóch workerów)."]},
  {id:"D",name:"Dwa klastry + Regional-DR",short:"Niezależne klastry, asynchroniczna replikacja wolumenów (ODF, macierz lub aplikacja)",dcLoss:"Failover aplikacji przez ACM",rpo:"> 0: interwał replikacji (od 1 min) i change rate",rto:"Minuty, wyzwalane ręcznie",site3:"Nie (hub najlepiej neutralny)",latency:"Bez limitu",verdict:"Domyślne dla danych stanowych bez trzeciej lokalizacji",tone:"good",
   detail:["ODF Regional-DR asynchronicznie mirroruje wolumeny RBD między dwoma klastrami ODF; ACM orkiestruje failover i failback per aplikacja.","Wymaga ODF Advanced i ACM. OpenShift Platform Plus zawiera tylko ODF Essentials.","Alternatywy: asynchroniczna replikacja macierzy z CSI VolumeReplication, VolSync lub replikacja w aplikacji (DB streaming, Kafka MirrorMaker 2).","Failover to operacja wrażliwa i domyślnie pozostaje ręczna; Event-Driven Ansible może ją zautomatyzować z zabezpieczeniem przed fałszywym wyzwoleniem."]},
  {id:"E",name:"Dwa klastry + Metro-DR",short:"Niezależne klastry nad zewnętrznym Ceph stretch cluster z arbitrem",dcLoss:"Failover aplikacji przez ACM",rpo:"0",rto:"Minuty",site3:"Tak, arbiter Ceph (~100 ms RTT)",latency:"< 10 ms",verdict:"RPO 0 z dwoma klastrami",tone:"good",
   detail:["Zewnętrzny Red Hat Ceph Storage rozciągnięty na oba DC z replikacją synchroniczną; arbiter monitora w trzeciej lokalizacji do ~100 ms.","Tylko all-flash, erasure coding niewspierany, jedna DRPolicy na rozwiązanie.","Hub recovery dla Metro-DR jest w ODF 4.18 w Technology Preview.","Odpowiednik z macierzą metro: replikacja synchroniczna plus witness, automatyzacja failoveru zależna od wsparcia CSI dostawcy."]},
  {id:"F",name:"Dwa klastry active/active",short:"GSLB kieruje ruch do obu klastrów naraz",dcLoss:"GSLB przekierowuje ruch",rpo:"Stateless 0; dane stanowe wg aplikacji",rto:"Sekundy do minut (health check + DNS TTL)",site3:"Nie (bazy konsensusowe: tak)",latency:"Wg aplikacji",verdict:"Domyślne dla stateless",tone:"good",
   detail:["Oba klastry obsługują ruch; globalny load balancer sprawdza route w każdym klastrze.","Dane stanowe replikuje sama aplikacja: replikacja DB, Kafka MirrorMaker 2 lub baza poza OpenShift.","Bazy konsensusowe (CockroachDB, YugabyteDB) potrzebują trzech failure domain, tak jak etcd. Dwa DC im nie wystarczą.","Oba klastry potrzebują tych samych zależności platformowych: IdP, registry, Git, Vault, S3, monitoring."]},
  {id:"G",name:"Dwa klastry + backup/restore",short:"Kopie OADP do object storage, odtworzenie na drugim klastrze",dcLoss:"Odtworzenie z kopii",rpo:"Częstotliwość kopii",rto:"Godziny",site3:"Nie",latency:"Bez limitu",verdict:"Uzupełnienie, nie podstawowe DR",tone:"info",
   detail:["OADP (Velero) kopiuje obiekty Kubernetes i persistent volumes (CSI snapshot + data mover) do S3.","Red Hat nie zaleca kopii jako jedynej strategii DR: odtworzenia są rzadkie, wolne i słabo testowane.","Kopie należą obok każdego innego wariantu: replikacja przenosi też logiczne uszkodzenia i usunięcia.","DORA art. 12 wymaga odtwarzania do fizycznie i logicznie oddzielonych systemów oraz okresowych testów odtwarzania."]}
 ]

  wVsphere:"Na vSphere z metro storage cluster vSphere HA może zrestartować VM control plane w drugim DC i przywrócić quorum bez quorum-restore.sh. Przetestuj to i potwierdź wsparcie z Red Hat.",

data:{title:"Dane i storage decydują o RPO",lead:"OpenShift nie wyznacza osiągalnego RPO; robią to storage i aplikacja. Najpierw ustal, gdzie jest stan. W bankach często w bazach poza OpenShift, a OpenShift niesie głównie warstwę stateless.",
 items:[{h:"ODF stretch cluster",b:"Jeden klaster OpenShift, dwie strefy danych (< 10 ms RTT) i strefa arbitra. Wymaga trzech węzłów control plane w trzech strefach i co najmniej czterech workerów równo w strefach danych."},
  {h:"ODF Metro-DR",b:"Dwa klastry nad zewnętrznym Red Hat Ceph Storage stretch cluster. RPO 0, tylko all-flash, jedna DRPolicy, arbiter w trzeciej lokalizacji do ~100 ms."},
  {h:"ODF Regional-DR",b:"Asynchroniczny mirroring RBD między dwoma klastrami ODF, interwał od 1 minuty. RPO > 0, bez limitu odległości, failover per aplikacja przez ACM."},
  {h:"Licencje",b:"Wszystkie trzy warianty ODF DR wymagają ODF Advanced; Metro-DR i Regional-DR dodatkowo ACM. OpenShift Platform Plus zawiera tylko ODF Essentials."},
  {h:"Macierze z replikacją CSI",b:"Hitachi GAD, NetApp, Pure, Dell, IBM. Replikacja wolumenów nie jest ustandaryzowana w CSI, więc automatyzacja failoveru zależy od dostawcy: brak wsparcia CSI, CSI VolumeReplication lub także replikacja metadanych namespace. Większość rozwiązań metro wymaga witnessa w trzeciej lokalizacji."},
  {h:"Replikacja w aplikacji",b:"DB streaming replication, Kafka MirrorMaker 2. Aplikacja wie, co replikuje, i raportuje stan. Synchroniczny konsensus znów wymaga trzech lokalizacji."},
  {h:"VolSync (część ACM)",b:"Asynchroniczne kopie PV między klastrami bez ODF. Pasuje do mniej krytycznych danych."},
  {h:"Kopie zawsze obok replikacji",b:"Replikacja przenosi też logiczne uszkodzenia i usunięcia. DORA art. 12 wymaga odtwarzania do fizycznie i logicznie oddzielonych systemów i okresowych testów."}]},
traffic:{title:"Routing ruchu i łączność",lead:"Globalny load balancer jest obowiązkowy w każdym wariancie z dwoma klastrami; dokumentacja wymaga go też dla klastra rozciągniętego. W active/active health check GSLB i DNS TTL wyznaczają RTO.",
 items:[{h:"Istniejący GSLB",b:"F5 BIG-IP DNS, Infoblox i podobne to najszybsza droga: wide IP per aplikacja, health check na route w każdym klastrze."},
  {h:"Red Hat Connectivity Link (Kuadrant)",b:"DNSPolicy na Gateway API deklaratywnie zarządza globalnymi rekordami DNS. Integracja z CoreDNS dla DNS on-prem jest GA od 1.3 (Tech Preview w 1.1). Wymaga delegacji strefy z firmowego DNS do VIP CoreDNS."},
  {h:"East-west między klastrami",b:"Submariner (część ACM) w warstwie sieci, Red Hat Service Interconnect (Skupper) w warstwie aplikacji lub OpenShift Service Mesh 3 w federacji multi-primary z preferencją lokalnej instancji."},
  {h:"Sieć klastra rozciągniętego",b:"Bezpośrednia łączność IP między węzłami, jednolite MTU, VIP on-prem (keepalived) dla API i ingress zakładające jeden segment L2. Oddzielne sieci L3 per DC wymagają zewnętrznego load balancera."},
  {h:"Zależności platformowe w obu DC",b:"DNS, NTP, IdP (AD/LDAP), image registry (Quay lub mirror), Git, Vault i S3 na kopie. Inaczej klaster DR nie uruchomi aplikacji, nawet mając dane."}]},
mgmt:{title:"Warstwa zarządzania musi przetrwać awarię",lead:"Hub ACM wyzwala failover przez DRPlacementControl i trzyma placementy oraz policies. Gdy padnie DC z hubem, nikt nie uruchomi failoveru, więc hub musi być odporniejszy niż to, co chroni.",
 items:[{h:"Umiejscowienie huba",b:"Dokumentacja ODF: aktywny hub przy klastrze głównym i pasywny przy zapasowym, albo aktywny hub w neutralnej trzeciej lokalizacji. Hub recovery dla Metro-DR jest w ODF 4.18 w Technology Preview."},
  {h:"Hub active/passive przez OADP",b:"Aktywny hub kopiuje do S3; pasywny na bieżąco odtwarza dane pasywne (syncRestoreWithNewBackups, domyślnie co 30 min). Dane aktywacyjne odtwarzane są dopiero przy failoverze. Od ACM 2.7 klastry zarządzane mogą ponownie podłączyć się automatycznie."},
  {h:"Runbook sterowany labelem",b:"Label zarządzany w Gicie (active / standby / failover) nakładany przez Policy przełącza BackupSchedule i BackupStorageLocation między hubami. Nadaje się jako gotowy runbook dla klienta."},
  {h:"GitOps jako źródło prawdy",b:"Stan aplikacji w Gicie, DR jako overlay nad stanem normalnym. Trzymaj ścieżkę break-glass (oc apply -k overlays/dr) na wypadek, gdy Git lub Argo CD są niedostępne."},
  {h:"Wyzwalanie failoveru",b:"Red Hat domyślnie zostawia je ręczne. Event-Driven Ansible może wywołać API ACM, ale projekt musi chronić przed fałszywym wyzwoleniem podczas partycji."}]},
virt:{title:"OpenShift Virtualization",lead:"VM to najczęstszy powód, dla którego klient chce klastra rozciągniętego: działają w jednej instancji, nie mają replikacji aplikacyjnej, a z VMware przywykły do vSphere Metro Storage Cluster. Odpowiednik w OpenShift to stretched 1+1+1 z synchronicznym storage, i tak jak vMSC wymaga trzeciej lokalizacji.",
 items:[{h:"Klaster rozciągnięty dla VM",b:"Symetryczna replikacja storage, rozciągnięte VLAN-y, latencja ~5 ms i witness site. Trzecią lokalizację wymusza etcd i zwykle hostuje ona jeden węzeł control plane. Zrestartowane VM mają RPO 0."},
  {h:"Bez fencingu VM nie przeniosą się bezpiecznie",b:"Node Health Check + Fence Agents Remediation (zalecane dla Virtualization) z taintem out-of-service. Bez strojenia przeplanowanie z niedostępnego węzła trwa ok. 12 minut, ze strojeniem ok. 1,5 minuty."},
  {h:"Restart storm",b:"Po utracie DC OpenShift przeplanowuje wszystkie VM naraz. Kontroluj kolejność i tempo (node selectory, priorytety) i trzymaj ~100% pojemności w ocalałym DC."},
  {h:"Dwa klastry dla VM",b:"Jednokierunkowa replikacja macierzy lub ODF Regional/Metro-DR, stan VM w GitOps jako overlay DR. Cross-cluster live migration (4.20, Tech Preview) służy do planowanych przenosin, nie do DR."},
  {h:"4–5 węzłów control plane",b:"Wprowadzone dla dwulokalizacyjnych wdrożeń VM na bare metal (2+2, 3+2). Przy utracie DC przeżywają dwie kopie etcd, ale odtworzenie pozostaje ręczne."},
  {h:"Subskrypcje",b:"Klaster rozciągnięty wymaga pełnej subskrypcji obu lokalizacji; lokalizacja warm DR może trzymać wyłączone VM. Warunki pojemności DR potwierdź ze sprzedażą."}]},
discovery:{title:"Pytania do klienta",lead:"Te odpowiedzi rozstrzygają między wariantami bardziej niż cokolwiek innego. Pierwsze trzy są kluczowe.",
 items:[{k:1,t:"Co dla Was znaczy „HA”: jakiego RPO i RTO potrzebuje każdy tier aplikacji i czy failover wyzwala automat, czy człowiek?"},
  {k:1,t:"Czy istnieje trzecia lokalizacja? Czy działa już witness, mediator lub tiebreaker dla storage lub vSAN? Czy może tam stanąć serwer lub VM dla węzła control plane albo arbitra Ceph?"},
  {k:1,t:"Gdzie są dane stanowe: bazy poza OpenShift, PV w OpenShift czy VM?"},
  {k:0,t:"Platforma: bare metal, vSphere czy inna? (4–5 węzłów control plane tylko na bare metal; na vSphere liczą się vSphere HA i vMSC.)"},
  {k:0,t:"Sieć między DC: odległość, RTT i jitter, przepustowość, rozciągnięte L2 tak/nie, redundancja tras."},
  {k:0,t:"Storage: ODF czy macierz ze sterownikiem CSI? Który dostawca i czy wspiera CSI VolumeReplication?"},
  {k:0,t:"Istniejący GSLB i DNS (F5, Infoblox) i kto nimi zarządza?"},
  {k:0,t:"Zależności platformowe w obu DC: IdP, registry, Git, Vault, S3, monitoring."},
  {k:0,t:"Regulacje: DORA, wymagania regulatora lub polityka wewnętrzna dot. oddzielonych kopii i częstotliwości testów DR."},
  {k:0,t:"Licencje: OpenShift Platform Plus czy OCP + ACM + ODF osobno? Funkcje DR ODF wymagają ODF Advanced."}],
 progress:"{done} z {total} odpowiedzianych"},

hero:{kicker:"Ghid interactiv",title:"Înaltă disponibilitate OpenShift în două centre de date",lead:"Ce poate și ce nu poate un cluster întins pe două locații, de ce contează a treia locație și ce arhitectură se potrivește cu RPO-ul, datele și workload-urile dumneavoastră. Încercați simulatorul, apoi lăsați configuratorul să aleagă o variantă."},
footer:"Actualizat la 18.10.2026. Material informativ, nu o declarație oficială de suport Red Hat; capabilitățile produselor se schimbă între versiuni, verificați-le în documentația actuală. Bazat pe documentația Red Hat (OCP 4.21 etcd guidance, ODF 4.18 DR, ACM) și pe blogurile Red Hat. Valorile RPO/RTO sunt intervale tipice; măsurați-le în propriul test.",
principle:{
 title:"De ce două locații nu ajung pentru un singur cluster",
 lead:"OpenShift își păstrează starea în etcd, care are nevoie de acordul majorității membrilor. Împărțit pe două locații, una dintre ele deține mereu majoritatea. Dacă acea locație cade, control plane-ul nu mai poate scrie.",
 hadr:{title:"HA nu este DR",body:"HA acoperă căderea unei componente în interiorul unui failure domain și se recuperează automat. DR acoperă pierderea unui întreg domeniu (un centru de date) și se măsoară în RPO (date pierdute) și RTO (timp de nefuncționare). Trei noduri control plane într-un singur DC înseamnă HA, nu DR."},
 drtwo:{title:"DR înseamnă două probleme",body:"Red Hat nu protejează clusterul în sine. Protejează continuitatea aplicațiilor prin failover pe un alt cluster. Asta înseamnă rezolvarea rutării traficului și a replicării datelor. Aplicațiile stateless au nevoie doar de prima, cele cu stare de ambele."},
 disposable:{title:"Clusterul este disposable, datele nu",lead:"Kubernetes presupune că un cluster poate fi reconstruit. Cu GitOps, fiecare cluster, operator și aplicație se reproduce din Git. Ce nu se poate reconstrui din Git este starea aplicațiilor. Proiectați DR în jurul ei.",
  cols:[{h:"Reconstruibil din Git",items:["Configurația de instalare a clusterului și operatorii day-2","Namespaces, Deployments, Routes, Policies","Secrets și configurație prin Vault / sealed secrets","Placement-uri ACM, overlay-uri DR"]},
        {h:"Trebuie protejat",items:["Baze de date (în OpenShift sau în afara lui)","Persistent volumes și discurile VM","Jurnale de mesaje (Kafka), object storage","Certificate, chei, starea IdP"]},
        {h:"Consecința",items:["Bugetul de HA merge în replicarea datelor, nu în întinderea control plane-ului","Un al doilea cluster construit din Git e mai ieftin de încredere decât unul întins","Backup-urile trebuie să existe lângă replicare: replicarea copiază și corupția"]}]},
 blast:{title:"Blast radius",body:"Un cluster întins unește ambele DC într-un singur failure domain. Un upgrade greșit, o MachineConfig stricată, certificate expirate sau un etcd corupt lovesc ambele locații deodată. Două clustere izolează aceste erori și permit upgrade-ul unuia ca și canary. O partiție de rețea e mai rea decât o cădere curată: pod-urile din locația izolată rulează în continuare fără control, deci pod-urile cu stare și VM-urile au nevoie de fencing înainte de a fi pornite în altă parte."}

variants:{

   detail:["Suportat de Red Hat, dar documentat ca un singur failure domain care nu trebuie să înlocuiască un plan DR.","Pierderea locației majoritare pune API-ul în read-only. Recuperarea este quorum-restore.sh pe ultimul nod din DC2, cu riscul pierderii scrierilor care nu au ajuns acolo.","Necesită conectivitate IP directă, MTU uniform și VIP-uri pentru API și ingress; rețele L3 separate au nevoie de un load balancer extern.","Fiecare perturbare (partiție, nepotrivire MTU, vârf de latență, jitter) trebuie testată înainte de producție."]},

  {id:"C",name:"Stretched 1+1+1",short:"Un cluster, un nod control plane pe locație, a treia locație găzduiește votul decisiv",dcLoss:"Control plane-ul supraviețuiește automat",rpo:"0 cu storage sincron",rto:"Minute: pod-uri RWX ~6–8 min, RWO și VM după fencing",site3:"Da, un nod control plane complet",latency:"Zone de date < 10 ms (ODF); arbitrul după limitele etcd",verdict:"Doar cu a treia locație, plus un plan DR",tone:"good",
   detail:["Topologia recomandată de Red Hat pentru un cluster pe mai multe locații: un membru control plane pe locație, trei locații.","Cu ODF stretch cluster (două zone de date + zonă arbitru) sau cu un storage array metro, datele au RPO 0.","Rămâne un singur failure domain: upgrade-urile, erorile de configurare și expirarea certificatelor lovesc ambele DC. Păstrați backup-uri OADP în afara clusterului sau un al doilea cluster.","A treia locație are nevoie de un nod real, nu de un witness ușor: clusterele standard nu au arbitru etcd-only (Two-Node with Arbiter este o topologie edge limitată la doi workeri)."]},

   detail:["ODF Regional-DR oglindește asincron volumele RBD între două clustere ODF; ACM orchestrează failover și failback per aplicație.","Necesită ODF Advanced și ACM. OpenShift Platform Plus include doar ODF Essentials.","Alternative: replicare asincronă a array-ului cu CSI VolumeReplication, VolSync sau replicare la nivel de aplicație (DB streaming, Kafka MirrorMaker 2).","Failover-ul este o operațiune sensibilă și rămâne manual implicit; Event-Driven Ansible îl poate automatiza cu protecție împotriva declanșărilor false."]},
