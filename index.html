data:{title:"Datele și storage-ul decid RPO-ul",lead:"OpenShift nu stabilește RPO-ul atins; storage-ul și aplicația o fac. Aflați mai întâi unde stă starea. În bănci, adesea în baze de date din afara OpenShift, iar OpenShift poartă mai ales stratul stateless.",
 items:[{h:"ODF stretch cluster",b:"Un cluster OpenShift, două zone de date (< 10 ms RTT) și o zonă arbitru. Necesită trei noduri control plane în trei zone și cel puțin patru workeri împărțiți egal în zonele de date."},
  {h:"ODF Metro-DR",b:"Două clustere peste un Red Hat Ceph Storage stretch cluster extern. RPO 0, doar all-flash, o singură DRPolicy, arbitru într-o a treia locație la până la ~100 ms."},
  {h:"ODF Regional-DR",b:"Mirroring RBD asincron între două clustere ODF, interval de la 1 minut. RPO > 0, fără limită de distanță, failover per aplicație prin ACM."},
  {h:"Licențiere",b:"Toate cele trei opțiuni ODF DR necesită ODF Advanced; Metro-DR și Regional-DR necesită și ACM. OpenShift Platform Plus include doar ODF Essentials."},
  {h:"Storage array-uri cu replicare CSI",b:"Hitachi GAD, NetApp, Pure, Dell, IBM. Replicarea volumelor nu este standardizată în CSI, deci automatizarea failover-ului depinde de furnizor: fără suport CSI, CSI VolumeReplication sau și replicarea metadatelor de namespace. Majoritatea soluțiilor metro au nevoie de un witness în a treia locație."},
  {h:"Replicare la nivel de aplicație",b:"Replicare DB streaming, Kafka MirrorMaker 2. Aplicația știe ce replică și raportează starea. Consensul sincron are din nou nevoie de trei locații."},
  {h:"VolSync (parte din ACM)",b:"Copii PV asincrone între clustere fără ODF. Potrivit pentru date mai puțin critice."},
  {h:"Backup-urile stau mereu lângă replicare",b:"Replicarea copiază și corupția logică și ștergerile. DORA art. 12 cere restaurarea în sisteme separate fizic și logic și teste periodice de restaurare."}]},
traffic:{title:"Rutarea traficului și conectivitatea",lead:"Un load balancer global este obligatoriu pentru orice variantă cu două clustere; documentația îl cere și pentru un cluster întins. La active/active, health check-ul GSLB și DNS TTL definesc RTO-ul.",
 items:[{h:"GSLB existent",b:"F5 BIG-IP DNS, Infoblox și altele similare sunt calea cea mai rapidă: un wide IP per aplicație, health check pe un route în fiecare cluster."},
  {h:"Red Hat Connectivity Link (Kuadrant)",b:"DNSPolicy pe Gateway API gestionează declarativ înregistrările DNS globale. Integrarea cu CoreDNS pentru DNS on-prem este GA din 1.3 (Tech Preview în 1.1). Necesită delegarea zonei din DNS-ul corporativ către VIP-urile CoreDNS."},
  {h:"East-west între clustere",b:"Submariner (parte din ACM) la nivel de rețea, Red Hat Service Interconnect (Skupper) la nivel de aplicație sau OpenShift Service Mesh 3 în federare multi-primary cu preferință pentru instanța locală."},
  {h:"Rețeaua clusterului întins",b:"Conectivitate IP directă între noduri, MTU uniform, VIP-uri on-prem (keepalived) pentru API și ingress care presupun un singur segment L2. Rețele L3 separate per DC au nevoie de un load balancer extern."},
  {h:"Dependențe de platformă în ambele DC",b:"DNS, NTP, IdP (AD/LDAP), image registry (Quay sau mirror), Git, Vault și S3 pentru backup-uri. Altfel clusterul DR nu poate porni aplicațiile chiar dacă datele există."}]},
mgmt:{title:"Stratul de management trebuie să supraviețuiască căderii",lead:"Hub-ul ACM declanșează failover-ul prin DRPlacementControl și păstrează placement-urile și policies. Dacă DC-ul cu hub-ul cade, nimeni nu poate porni failover-ul, deci hub-ul trebuie să fie mai rezilient decât ceea ce protejează.",
 items:[{h:"Amplasarea hub-ului",b:"Documentația ODF: hub activ lângă clusterul primar și hub pasiv lângă cel secundar, sau hub activ într-o a treia locație neutră. Hub recovery pentru Metro-DR este Technology Preview în ODF 4.18."},
  {h:"Hub active/passive prin OADP",b:"Hub-ul activ face backup în S3; cel pasiv restaurează continuu datele pasive (syncRestoreWithNewBackups, interval implicit 30 min). Datele de activare se restaurează doar la failover. Din ACM 2.7 clusterele gestionate se pot reconecta automat."},
  {h:"Runbook condus de label",b:"Un label gestionat în Git (active / standby / failover) aplicat prin Policy comută BackupSchedule și BackupStorageLocation între hub-uri. Utilizabil ca runbook gata făcut pentru client."},
  {h:"GitOps ca sursă de adevăr",b:"Starea aplicațiilor în Git, DR ca overlay peste starea normală. Păstrați o cale break-glass (oc apply -k overlays/dr) pentru când Git sau Argo CD nu sunt accesibile."},
  {h:"Declanșarea failover-ului",b:"Red Hat îl păstrează manual implicit. Event-Driven Ansible poate apela API-ul ACM, dar designul trebuie să protejeze împotriva declanșărilor false în timpul unei partiții."}]},
virt:{title:"OpenShift Virtualization",lead:"VM-urile sunt cel mai frecvent motiv pentru care un client vrea un cluster întins: rulează într-o singură instanță, nu au replicare aplicativă și obiceiurile din VMware așteaptă un vSphere Metro Storage Cluster. Echivalentul în OpenShift este stretched 1+1+1 cu storage sincron și, la fel ca vMSC, are nevoie de a treia locație.",
 items:[{h:"Cluster întins pentru VM",b:"Replicare simetrică a storage-ului, VLAN-uri întinse, latență ~5 ms și un witness site. A treia locație este cerută de etcd și găzduiește de obicei un nod control plane. VM-urile repornite au RPO 0."},
  {h:"Fără fencing, VM-urile nu se mută în siguranță",b:"Node Health Check + Fence Agents Remediation (recomandat pentru Virtualization) cu taint-ul out-of-service. Nereglat, replanificarea de pe un nod inaccesibil durează cca 12 minute; reglat, cca 1,5 minute."},
  {h:"Restart storm",b:"După pierderea unui DC, OpenShift replanifică toate VM-urile deodată. Controlați ordinea și ritmul (node selectors, priorități) și păstrați ~100% capacitate în DC-ul supraviețuitor."},
  {h:"Două clustere pentru VM",b:"Replicare unidirecțională a array-ului sau ODF Regional/Metro-DR, starea VM în GitOps ca overlay DR. Cross-cluster live migration (4.20, Tech Preview) este pentru mutări planificate, nu pentru DR."},
  {h:"4–5 noduri control plane",b:"Introduse pentru implementări VM pe două locații pe bare metal (2+2, 3+2). Două copii etcd supraviețuiesc pierderii unui DC, dar recuperarea rămâne manuală."},
  {h:"Subscripții",b:"Un cluster întins necesită ambele locații complet subscrise; o locație warm DR poate păstra VM-uri oprite. Confirmați termenii pentru capacitatea DR cu vânzările."}]},
discovery:{title:"Întrebări pentru client",lead:"Aceste răspunsuri decid între variante mai mult decât orice altceva. Primele trei sunt cheie.",
 items:[{k:1,t:"Ce înseamnă „HA” pentru dumneavoastră: ce RPO și RTO are nevoie fiecare tier de aplicații și failover-ul este automat sau declanșat de om?"},
  {k:1,t:"Există o a treia locație? Rulați deja un witness, mediator sau tie-breaker pentru storage sau vSAN? Ar putea găzdui un server sau VM pentru un nod control plane sau un arbitru Ceph?"},
  {k:1,t:"Unde stau datele cu stare: baze de date în afara OpenShift, PV-uri în OpenShift sau VM-uri?"},
  {k:0,t:"Platformă: bare metal, vSphere sau altă? (4–5 noduri control plane doar pe bare metal; pe vSphere contează vSphere HA și vMSC.)"},
  {k:0,t:"Rețeaua între DC: distanță, RTT și jitter, lățime de bandă, L2 întins da/nu, redundanța căilor."},
  {k:0,t:"Storage: ODF sau un array cu driver CSI? Ce furnizor și suportă CSI VolumeReplication?"},
  {k:0,t:"GSLB și DNS existente (F5, Infoblox) și cine le operează?"},
  {k:0,t:"Dependențe de platformă în ambele DC: IdP, registry, Git, Vault, S3, monitoring."},
  {k:0,t:"Reglementare: DORA, cerințele autorității de reglementare sau politica internă privind backup-uri separate și frecvența testelor DR."},
  {k:0,t:"Licențiere: OpenShift Platform Plus sau OCP + ACM + ODF separat? Funcțiile DR ODF necesită ODF Advanced."}],
 progress:"{done} din {total} răspunse"},

/* ---------- simulator ---------- */
function simState(){
 const t=TOPOS[S.topo], f=S.failed, iso=S.isolated;
 const sites=["dc1","dc2","s3"];
 const alive=s=>t[s]>0&&!f.has(s);
 if(t.two){
  const up=sites.filter(s=>t[s]>0&&alive(s));
  if(up.length===0) return {kind:"two",tone:"crit",text:T.sim.out.all,api:"down",rec:"recoverBackup",members:"0 / 0",quorum:"—"};
  if(f.size) {const lost=sites.find(s=>t[s]>0&&f.has(s)); return {kind:"two",tone:"warn",text:fmt(T.sim.out.twoLost,{site:T.sim.sites[lost]}),api:"rw",rec:"recoverFailover",members:`${t[up[0]]} / ${t[up[0]]}`,quorum:"2 / 3"};}
  if(iso) return {kind:"two",tone:"warn",text:T.sim.out.twoPartition,api:"rw",rec:"recoverFailover",members:"3 / 3 · 3 / 3",quorum:"2 / 3"};
  return {kind:"two",tone:"good",text:T.sim.out.twoOk,api:"rw",rec:"recoverNone",members:"3 / 3 · 3 / 3",quorum:"2 / 3"};
 }
 const total=t.dc1+t.dc2+t.s3, maj=Math.floor(total/2)+1;
 const aliveN=sites.reduce((n,s)=>n+(alive(s)?t[s]:0),0);
 if(aliveN===0) return {tone:"crit",text:T.sim.out.all,api:"down",rec:"recoverBackup",members:`0 / ${total}`,quorum:`${maj} / ${total}`};
 // partition: DC2 isolated from DC1 and S3
 if(iso && alive("dc2")){
  const sideA=(alive("dc1")?t.dc1:0)+(alive("s3")?t.s3:0), sideB=t.dc2;
  const members=`${aliveN} / ${total}`, quorum=`${maj} / ${total}`;
  if(t.s3>0 && alive("s3")) return {tone:"warn",text:T.sim.out.partition111,api:"rw",rec:"recoverAuto",members,quorum};
  if(sideA>=maj) return {tone:"warn",text:T.sim.out.partition,api:"rw",rec:"recoverAuto",members,quorum};
  return {tone:"crit",text:T.sim.out.partitionMajorLost,api:"ro",rec:"recoverManual",members,quorum};
 }
 const members=`${aliveN} / ${total}`, quorum=`${maj} / ${total}`;
 if(f.size===0) return {tone:"good",text:T.sim.out.ok,api:"rw",rec:"recoverNone",members,quorum};
 if(aliveN>=maj) return {tone:"warn",text:T.sim.out.minor,api:"rw",rec:"recoverAuto",members,quorum};
 return {tone:"crit",text:fmt(T.sim.out.major,{copies:aliveN}),api:"ro",rec:"recoverManual",members,quorum};
}
function renderSim(){
 const t=TOPOS[S.topo], st=simState();
 const sites=["dc1","dc2","s3"];
 $("#sites").innerHTML=sites.map(s=>{
  const n=t[s], failed=S.failed.has(s), iso=S.isolated&&s==="dc2"&&!failed, empty=n===0;
  const nodes=[];
  for(let i=0;i<n;i++) nodes.push(`<span class="node cp${failed?" dead":""}${iso&&st.api==="rw"&&!(t.s3>0)?" orphan":""}">${T.sim.cp}${t.two?"":" "+(i+1)}</span>`);
  if(!empty) for(let i=0;i<2;i++) nodes.push(`<span class="node${failed?" dead":""}${iso?" orphan":""}">W</span>`);
  const sub=empty?T.sim.none:(t.two?`${T.sim.cluster} ${s==="dc1"?"A":"B"} · 3 CP + ${T.sim.workers}`:`${n} CP + ${T.sim.workers}`);
  return `<div class="site${failed?" failed":""}${iso?" isolated":""}${empty?" empty":""}" data-site="${s}" role="button" tabindex="${empty?-1:0}" aria-pressed="${failed}"><h4>${esc(T.sim.sites[s])}${failed?`<span class="pill crit">✕</span>`:iso?`<span class="pill warn">⇆</span>`:""}</h4><div class="nodes">${nodes.join("")}</div><small>${esc(sub)}</small></div>`;
 }).join("")+`<div class="link">${S.isolated?"DC1 ✕ DC2":"DC1 ⟷ DC2"}${t.s3?" ⟷ S3":""}</div>`;

function recommend(){
 const c=S.cfg, X=T.config.texts, out={primary:null,text:"",also:[],warn:[],needs:[]};
 const vm=c.stateful==="vm", bm=c.platform==="bm", single=c.single==="yes", site3=c.site3==="yes", lat=+c.latency;
 if(c.stateful==="ext"){out.primary="F";out.text=X.extF;out.also.push(X.alsoG);out.warn.push(X.wConsensus);out.needs.push(X.nGslb,X.nGit,X.nDeps);}
 else if(c.rpo==="hour"){out.primary="G";out.text=X.hourG;out.also.push(X.alsoF);out.needs.push(X.nS3,X.nGit,X.nGslb);}
 else if(c.rpo==="min"){out.primary="D";out.text=X.minD;out.also.push(X.alsoF,X.alsoG);out.warn.push(X.wHub);out.needs.push(X.nOdfAdv,X.nGslb,X.nGit,X.nS3);}
 else if(!site3){
  if(single){ if(bm){out.primary="B";out.text=X.zeroNoSiteSingleBm;} else {out.primary="A";out.text=X.zeroNoSiteSingle; if(c.platform!=="bm") out.warn.push(X.wBmOnly);} out.also.push(X.alsoDR,X.alsoG);out.warn.push(X.wSingle);out.needs.push(X.nArray,X.nTest,X.nGslb); }
  else {out.primary="D";out.text=X.zeroNoSite;out.also.push(X.alsoF,X.alsoG);out.warn.push(X.wHub);out.needs.push(X.nArray,X.nGslb,X.nGit,X.nS3);}
 } else {
  if(single){out.primary="C";out.text=X.zeroSiteSingle;out.also.push(X.alsoDR,X.alsoG);out.warn.push(X.wSingle);out.needs.push(X.nSite3,X.nOdfAdv,X.nGslb,X.nTest);}
  else {out.primary="E";out.text=X.zeroSiteE;out.also.push(X.alsoF,X.alsoD,X.alsoG);out.warn.push(X.wHub);out.needs.push(X.nSite3,X.nOdfAdv,X.nGslb,X.nGit,X.nS3);}
 }
 const stretched=["A","B","C"].includes(out.primary);
 if(lat>100 && stretched) out.warn.unshift(X.wLat100); else if(lat>10 && (stretched||out.primary==="E")) out.warn.unshift(X.wLat10); else if(lat>5 && stretched) out.warn.unshift(X.wLat5);
 if(vm){out.warn.push(X.wVm);out.needs.push(X.nFence);}
 if(c.platform==="vs" && stretched) out.warn.push(X.wVsphere);
 if(!out.needs.includes(X.nDeps)) out.needs.push(X.nDeps);
 return out;
}

 const nav=`<div class="controls"><button class="btn" id="mPrev" ${st===0?"disabled":""}>← ${esc(V.prev)}</button><span class="pill info">${esc(fmt(V.step,{n:st+1}))}</span><button class="btn" id="mNext" ${st===5?"disabled":""}>${esc(V.next)} →</button></div>`;
 const status=`<div class="kv"><div><span>${esc(V.status.backup)}</span>${esc(V.vals.backup[st])}</div><div><span>${esc(V.status.trigger)}</span>${esc(V.vals.trigger[st])}</div><div><span>${esc(V.status.risk)}</span>${esc(V.vals.risk[st])}</div></div>`;
 const place=`<div><h4>${esc(V.placement.title)}</h4><div class="seg wrap-seg" data-vkey="place">${Object.entries(V.placement.opts).map(([k,v])=>`<button data-val="${k}" class="${k===pl?"on":""}">${esc(v)}</button>`).join("")}</div><p style="font-size:.9rem;margin-top:6px">${esc(V.placement.impact[pl])}</p></div>`;
 $("#vizMgmt").innerHTML=`<div><h3>${esc(V.title)}</h3><p class="lead" style="font-size:.92rem">${esc(V.lead)}</p></div>${nav}<div class="sim"><div class="vizwrap">${svgWrap(350,g,V.title)}</div><div class="verdict ${st===2?"crit":st===3?"warn":"good"}"><strong>${esc(stp.t)}</strong><span>${esc(stp.d)}</span></div></div>${status}${place}`;
}

/* virt */
function renderVirt(){
 const V=T.viz.virt, TL=V.tl, s=S.viz.virt;
 const def=[["detect",50],["tolerate",300],["graceful",360],["start",60]];
 const yours=[["detect",s.detect],["tolerate",s.tolerate],[s.fencing?"fence":"graceful",s.fencing?30:360],["start",60]];
 const tot=a=>a.reduce((n,x)=>n+x[1],0), max=Math.max(tot(def),tot(yours));
 const X0=150,X1=736, sx=v=>X0+(v/max)*(X1-X0);
 const cls={detect:"c1",tolerate:"c2",fence:"c3",graceful:"c4",start:"c5"};
 const row=(y,name,segs)=>{let x=0,g=txt(X0-10,y+22,name,"h","end");segs.forEach(([k,v])=>{const w=sx(x+v)-sx(x);g+=`<rect x="${sx(x)}" y="${y}" width="${w}" height="32" class="seg-${cls[k]}"/>`;if(w>58)g+=txt(sx(x)+w/2,y+21,`${v} ${TL.sec}`,"s on");x+=v;});const t=tot(segs);g+=txt(X1,y-6,`${TL.total}: ${t>=120?(t/60).toFixed(1)+" "+TL.min:t+" "+TL.sec}`,"s tot","end");return g;};
 let g=row(44,TL.rows.def,def)+row(110,TL.rows.yours,yours);
 const ticks=[0,120,300,600].filter(v=>v<=max); ticks.forEach(v=>{g+=`<line x1="${sx(v)}" y1="30" x2="${sx(v)}" y2="150" class="grid"/>`+txt(sx(v),166,v>=60?(v/60)+" "+TL.min:v+" "+TL.sec,"s ax");});
 const legend=`<div class="legend">${Object.entries(TL.phases).map(([k,v])=>`<span><i class="seg-${cls[k]}"></i>${esc(v)}</span>`).join("")}</div>`;
 const ctl=`<div class="controls"><label class="ctl"><span>${esc(TL.sliders.detect)}: <b>${s.detect} s</b></span><input type="range" id="vDetect" min="10" max="50" step="5" value="${s.detect}"></label>
  <label class="ctl"><span>${esc(TL.sliders.tolerate)}: <b>${s.tolerate} s</b></span><input type="range" id="vTol" min="0" max="300" step="10" value="${s.tolerate}"></label>
  <button class="btn ${s.fencing?"":"on"}" id="vFence">${esc(TL.sliders.fencing)}: ${s.fencing?"ON":"OFF"}</button></div>`;
 const warn=s.fencing?"":`<div class="verdict crit">${esc(TL.stuck)}</div>`;
 const vm=`<div><h4>${esc(V.vmsc.title)}</h4><div class="cmp"><div class="cmph">${esc(V.vmsc.left)}</div><div class="cmph">${esc(V.vmsc.right)}</div>${V.vmsc.rows.map(r=>`<div>${esc(r[0])}</div><div class="acc">${esc(r[1])}</div>`).join("")}</div></div>`;
 const fit=Math.min(s.vms,Math.floor(s.vms*s.cap/100)), wait=s.vms-fit;
 const storm=`<div><h4>${esc(V.storm.title)}</h4><div class="controls"><label class="ctl"><span>${esc(V.storm.vms)}: <b>${s.vms}</b></span><input type="range" id="vVms" min="10" max="500" step="10" value="${s.vms}"></label><label class="ctl"><span>${esc(V.storm.cap)}: <b>${s.cap} %</b></span><input type="range" id="vCap" min="10" max="100" step="5" value="${s.cap}"></label></div>
  <div class="bar"><i style="width:${fit/s.vms*100}%"></i></div><div class="verdict ${wait?"crit":"good"}">${esc(fmt(V.storm.fit,{n:fit,m:wait}))}. ${esc(wait?fmt(V.storm.over,{m:wait}):V.storm.ok)}</div></div>`;
 $("#vizVirt").innerHTML=`<div><h3>${esc(V.title)}</h3><p class="lead" style="font-size:.92rem">${esc(V.lead)}</p></div>${ctl}<div class="vizwrap">${svgWrap(178,g,V.title)}</div>${legend}${warn}${vm}${storm}`;
}

function renderVizAll(){renderStorage();renderTraffic();renderMgmt();renderVirt();}
const _renderAll=renderAll; renderAll=function(){_renderAll();renderVizAll();};
document.addEventListener("click",e=>{
 const sg=e.target.closest(".seg[data-vkey] button"); if(sg){const k=sg.parentElement.dataset.vkey,v=sg.dataset.val; if(k==="storage")S.viz.storage=v; if(k==="ew")S.viz.traffic.ew=v; if(k==="place")S.viz.mgmt.place=v; saveViz(); if(k==="storage")renderStorage(); else if(k==="ew")renderTraffic(); else renderMgmt(); return;}
 if(e.target.id==="tFail"){trafficFail();return;}
 const dep=e.target.closest("[data-dep]"); if(dep){const i=+dep.dataset.dep; S.viz.traffic.missing.has(i)?S.viz.traffic.missing.delete(i):S.viz.traffic.missing.add(i); renderTraffic(); return;}
 if(e.target.id==="mNext"){S.viz.mgmt.step=Math.min(5,S.viz.mgmt.step+1);saveViz();renderMgmt();return;}
 if(e.target.id==="mPrev"){S.viz.mgmt.step=Math.max(0,S.viz.mgmt.step-1);saveViz();renderMgmt();return;}
 if(e.target.id==="vFence"){S.viz.virt.fencing=!S.viz.virt.fencing;saveViz();renderVirt();return;}
 const go=e.target.closest("[data-goto]"); if(go){const map={D:"regional",E:"metro",C:"odfstretch",G:"oadp",F:"app",A:"array",B:"array"}; if(map[go.dataset.goto]){S.viz.storage=map[go.dataset.goto];saveViz();renderStorage();}}
});
const SL={tHc:["traffic","hc"," s"],tTtl:["traffic","ttl"," s"],vDetect:["virt","detect"," s"],vTol:["virt","tolerate"," s"],vVms:["virt","vms",""],vCap:["virt","cap"," %"]};
document.addEventListener("input",e=>{const m=SL[e.target.id]; if(!m) return; S.viz[m[0]][m[1]]=+e.target.value; const b=e.target.parentElement.querySelector("b"); if(b) b.textContent=e.target.value+m[2];});
document.addEventListener("change",e=>{const m=SL[e.target.id]; if(!m) return; S.viz[m[0]][m[1]]=+e.target.value; saveViz(); if(m[0]==="traffic") renderTraffic(); else renderVirt();});
renderVizAll();

</script>
</body>
